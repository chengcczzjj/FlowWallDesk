appId: com.lingyue.desk
productName: LingyueDesk
asar: true
directories:
  buildResources: resources/build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: resources/build
    to: build
    filter: ['icon.*']
  - from: assets
    to: assets
    filter: ['**/*']
win:
  icon: resources/build/icon.ico
  executableName: LingyueDesk
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
publish:
  - provider: github
    owner: chengcczzjj
    repo: FlowWallDesk
    releaseType: release
