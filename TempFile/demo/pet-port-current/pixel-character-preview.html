    }

    function drawHumanSleeping(target, palette, phase, options, features) {
      const ink = palette.ink || "#17171b";
      const breathe = options.motion ? Math.round(Math.sin(phase * 2) > 0 ? 1 : 0) : 0;
      px(target, 15, 31 - breathe, 23, 9 + breathe, ink);
      px(target, 16, 32 - breathe, 21, 7 + breathe, palette.shirt);
      px(target, 20, 36, 15, 3, palette.shirtDark);
      px(target, 35, 35, 5, 3, palette.skin);
      px(target, 14, 39, 25, 1, "rgba(82, 55, 39, 0.13)");
      target.save();
      target.translate(-1, 13);
      drawBackHair(target, palette, 0, phase, { ...options, motion: false }, features);
      drawHead(target, palette, 0, features);
      drawFace(target, palette, "sleepy", "sleep", phase, false, 0);
      drawHumanAccessory(target, palette, features, 0);
      target.restore();
      px(target, 18, 31, 18, 0.5, colorMix(palette.hair, "#ffffff", 0.16));
    }

    function drawBlueCompanionStanding(target, palette, phase, options) {
      const ink = palette.ink || "#17171b";
      const hair = palette.hair || palette.mane;
      const hairDark = colorMix(hair, "#223949", 0.24);
      const hairMid = colorMix(hair, palette.hairLight || palette.maneLight, 0.24);
      const hairLight = palette.hairLight || palette.maneLight;
      const skin = palette.skin;
      const skinDark = palette.skinDark;
      const shirt = palette.shirt;
      const shirtShade = colorMix(shirt, palette.accent, 0.10);
      const eye = palette.accent;
      const shoe = palette.shoe;
      const flower = palette.fang || "#fff8ef";
      const flowerCore = palette.accent2 || "#f0ae54";
      const centerWidth = 48;

      function dot(x, y, color) {
        px(target, x, y, 1, 1, color);
      }

      function block(x, y, w, h, color) {
        for (let row = 0; row < h; row += 1) {
          for (let col = 0; col < w; col += 1) {
            dot(x + col, y + row, color);
          }
        }
      }

      function mirrorBlock(x, y, w, h, color) {
        block(x, y, w, h, color);
        block(centerWidth - x - w, y, w, h, color);
      }

      function mirrorDot(x, y, color) {
        dot(x, y, color);
        dot(centerWidth - x - 1, y, color);
      }

      target.save();
      target.translate(0, -5);

      // Symmetric twin tails and simple helmet hair.
      mirrorBlock(7, 13, 7, 4, ink);
      mirrorBlock(5, 17, 10, 16, ink);
      mirrorBlock(7, 33, 7, 5, ink);
      mirrorBlock(8, 14, 5, 3, hairLight);
      mirrorBlock(6, 18, 8, 14, hair);
      mirrorBlock(8, 32, 5, 5, hairDark);
      mirrorBlock(8, 20, 2, 11, hairMid);
      mirrorBlock(12, 19, 2, 13, colorMix(hairDark, "#000000", 0.05));

      block(18, 6, 12, 1, ink);
      block(15, 7, 18, 1, ink);
      block(13, 8, 22, 2, ink);
      block(12, 10, 24, 5, ink);
      block(13, 15, 22, 3, ink);
      block(18, 7, 12, 1, hairLight);
      block(15, 8, 18, 2, hairLight);
      block(14, 10, 20, 3, hair);
      block(13, 13, 22, 4, hair);
      block(16, 15, 16, 2, hairLight);
      mirrorBlock(12, 18, 3, 7, ink);
      mirrorBlock(13, 18, 2, 6, hairDark);

      // Face, ears, and calm symmetric expression.
      block(14, 17, 20, 12, ink);
      block(15, 18, 18, 10, skin);
      mirrorBlock(11, 20, 3, 5, ink);
      mirrorBlock(12, 21, 2, 3, skinDark);
      block(16, 27, 16, 2, colorMix(skin, skinDark, 0.18));
      mirrorBlock(17, 20, 4, 4, ink);
      mirrorBlock(18, 21, 2, 2, eye);
      mirrorDot(18, 20, "#ffffff");
      mirrorBlock(17, 25, 3, 1, palette.blush);
      block(22, 25, 4, 1, ink);
      dot(23, 24, colorMix(skin, "#ffffff", 0.18));

      // Paired flower pins keep the twin-tail silhouette balanced.
      mirrorDot(11, 12, flower);
      mirrorDot(10, 13, flower);
      mirrorDot(12, 13, flower);
      mirrorDot(11, 14, flower);
      mirrorDot(11, 13, flowerCore);

      // Oversized tee and compact limbs.
      block(21, 29, 6, 2, ink);
      block(22, 29, 4, 2, skin);
      block(15, 31, 18, 12, ink);
      block(16, 32, 16, 10, shirt);
      block(18, 32, 12, 3, colorMix(shirt, "#ffffff", 0.42));
      block(18, 36, 12, 5, shirtShade);
      mirrorBlock(12, 33, 4, 8, ink);
      mirrorBlock(13, 34, 2, 6, skin);
      mirrorBlock(18, 42, 4, 4, ink);
      mirrorBlock(19, 42, 2, 3, skin);
      mirrorBlock(16, 45, 7, 2, shoe);
      target.restore();
    }

    function drawHumanCharacter(target, state, palette, features, phase, tick, options, transform) {
      const humanPalette = getHumanPalette(palette);
      const legTick = state.pose === "walk" || state.arms === "type" ? tick : 0;
      target.save();
      target.translate(SPRITE_OFFSET_X + transform.shake + transform.sway, SPRITE_OFFSET_Y + transform.jumpLift);
      if (features.characterStyle === "blueCompanion" && state.pose === "idle") {
        drawBlueCompanionStanding(target, humanPalette, phase, options);
        target.restore();
        drawSpriteEffects(target, humanPalette, state.fx, phase, options);
        return;
      }
      if (state.pose === "sleep") {
        drawHumanSleeping(target, humanPalette, phase, options, features);
        drawHighDensityActionCues(target, humanPalette, state, phase, options, features);
        target.restore();
        drawSpriteEffects(target, humanPalette, state.fx, phase, options);
        return;
      }
      if (state.pose === "sit") {
        drawHumanSitting(target, humanPalette, phase, options, transform.headTilt, state, features);
        drawMascotProp(target, humanPalette, state.prop, phase, options);
        drawHighDensityActionCues(target, humanPalette, state, phase, options, features);
        target.restore();
        drawSpriteEffects(target, humanPalette, state.fx, phase, options);
        return;
      }
      drawBackHair(target, humanPalette, transform.headTilt, phase, options, features);
      drawLegs(target, humanPalette, legTick);
      drawBody(target, humanPalette, features);
      drawArms(target, humanPalette, state.arms, phase, options);
      target.save();
      target.translate(0, transform.headDrop);
      drawHead(target, humanPalette, transform.headTilt, features);
      drawFace(target, humanPalette, state.eyes, state.mouth, phase, transform.shouldBlink, transform.headTilt);
      drawHumanAccessory(target, humanPalette, features, transform.headTilt);
      target.restore();
      drawHumanHighDensityDetails(target, humanPalette, state, phase, options, features);
      drawMascotProp(target, humanPalette, state.prop, phase, options);
      drawHighDensityActionCues(target, humanPalette, state, phase, options, features);
      target.restore();
      drawSpriteEffects(target, humanPalette, state.fx, phase, options);
    }

    function drawCharacter(target, stateKey, themeKey, time, options = settings) {
      const state = states[stateKey];
      const palette = getActivePalette(themeKey);
      const features = getActiveFeatures();
      const phase = time * state.tempo * options.speed;
      const tick = Math.floor(phase * 6);
      const shouldBlink = false;
      const jumpLift = state.pose === "jump" && options.motion
        ? -Math.max(0, Math.round(Math.max(0, Math.sin(phase * Math.PI * 2)) * 6 * options.intensity))
        : 0;
      const shake = (state.pose === "error" || state.pose === "stomp") && options.motion
        ? (Math.floor(phase * 12) % 2 === 0 ? -1 : 1) * Math.max(1, Math.round(options.intensity))
        : 0;
      const sway = (state.pose === "sway" || state.pose === "talk") && options.motion
        ? Math.round(Math.sin(phase * 2) * options.intensity)
        : 0;
      const headTilt = (state.pose === "tilt" || state.pose === "think") && options.motion
        ? Math.round(Math.sin(phase * Math.PI) * options.intensity)
        : 0;
      const headDrop = state.pose === "slump" ? 3 : 0;
      const legTick = state.pose === "walk" || state.arms === "type" ? tick : 0;

      target.setTransform(1, 0, 0, 1, 0, 0);
      target.clearRect(0, 0, PREVIEW_WIDTH, PREVIEW_HEIGHT);
      target.save();
      target.scale(PIXEL_DENSITY, PIXEL_DENSITY);
      drawActionBackdrop(target, palette, state, phase, options);
      target.save();
      target.translate(SPRITE_OFFSET_X, SPRITE_OFFSET_Y);
      drawShadow(target, phase, palette, options, jumpLift);
      target.restore();
      if (features.avatarType === "human") {
        drawHumanCharacter(target, state, palette, features, phase, tick, options, {
          shake,
          sway,
          jumpLift,
          headTilt,
          headDrop,
          shouldBlink
        });
        target.restore();
        return;
      }
      target.save();
      target.translate(SPRITE_OFFSET_X + shake + sway, SPRITE_OFFSET_Y + jumpLift);
      if (state.pose === "sleep") {
        drawMascotSleeping(target, palette, phase, options, features);
        drawMascotHighDensityDetails(target, palette, state, phase, options, features);
        drawHighDensityActionCues(target, palette, state, phase, options, features);
        target.restore();
        drawSpriteEffects(target, palette, state.fx, phase, options);
        target.restore();
        return;
      }
      if (state.pose === "sit") {
        drawMascotSitting(target, palette, phase, options, headTilt, state, features);
        drawMascotProp(target, palette, state.prop, phase, options);
        drawMascotHighDensityDetails(target, palette, state, phase, options, features);
        drawHighDensityActionCues(target, palette, state, phase, options, features);
        target.restore();
        drawSpriteEffects(target, palette, state.fx, phase, options);
        target.restore();
        return;
      }
      drawMascotTail(target, palette, phase, options, features);
      drawMascotLegs(target, palette, legTick, state.pose);
      drawMascotBody(target, palette, features);
      drawMascotArms(target, palette, state.arms, phase);
      target.save();
      target.translate(0, headDrop);
      drawMascotEarsAndMane(target, palette, headTilt, phase, options, features);
      drawMascotHead(target, palette, headTilt);
      drawMascotSunglasses(target, palette, headTilt, features);
      drawMascotFace(target, palette, state.eyes, state.mouth, shouldBlink, headTilt, phase, options);
      target.restore();
      drawMascotHighDensityDetails(target, palette, state, phase, options, features);
      drawMascotProp(target, palette, state.prop, phase, options);
      drawHighDensityActionCues(target, palette, state, phase, options, features);
      target.restore();
      drawSpriteEffects(target, palette, state.fx, phase, options);
      target.restore();
    }

    function colorMix(colorA, colorB, amount) {
      const a = hexToRgb(colorA);
      const b = hexToRgb(colorB);
      const mix = {
        r: Math.round(a.r + (b.r - a.r) * amount),
        g: Math.round(a.g + (b.g - a.g) * amount),
        b: Math.round(a.b + (b.b - a.b) * amount)
      };
      return `rgb(${mix.r}, ${mix.g}, ${mix.b})`;
    }

    function hexToRgb(hex) {
      const normalized = hex.replace("#", "");
      return {
        r: parseInt(normalized.slice(0, 2), 16),
        g: parseInt(normalized.slice(2, 4), 16),
        b: parseInt(normalized.slice(4, 6), 16)
      };
    }

    function hexToRgba(hex, alpha) {
      const color = hexToRgb(hex);
      return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
    }

    function createStateButtons() {
      const stateGrid = document.getElementById("stateGrid");
      const stateTabs = document.getElementById("stateTabs");
      stateGroups.forEach((group, groupIndex) => {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "state-tab";
        tab.dataset.groupIndex = String(groupIndex);
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-pressed", String(settings.viewGroupIndex === groupIndex));
        tab.textContent = group.title;
        tab.addEventListener("click", () => {
          settings.viewGroupIndex = groupIndex;
          syncUI();
        });
        stateTabs.appendChild(tab);

        const section = document.createElement("section");
        section.className = "state-group";
        section.dataset.groupIndex = String(groupIndex);
        const title = document.createElement("div");
        title.className = "state-group-title";
        title.textContent = group.title;
        const buttons = document.createElement("div");
        buttons.className = "state-grid";

        group.items.forEach((key) => {
          const state = states[key];
          const button = document.createElement("button");
          button.type = "button";
          button.className = "state-button";
          button.dataset.state = key;
          button.setAttribute("aria-pressed", String(settings.state === key));
          button.innerHTML = `
            <span>
              <span class="button-main">${state.label}</span>
              <span class="button-sub">${state.short}</span>
            </span>
            <span class="button-mark" aria-hidden="true"></span>
          `;
          button.addEventListener("click", () => setState(key));
          buttons.appendChild(button);
        });

        section.append(title, buttons);
        stateGrid.appendChild(section);
      });
    }

    function findGroupIndexForState(key) {
      return Math.max(0, stateGroups.findIndex((group) => group.items.includes(key)));
    }

    function createPaletteButtons() {
      const paletteGrid = document.getElementById("paletteGrid");
      Object.entries(themes).forEach(([key, theme]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "palette-button";
        button.dataset.theme = key;
        button.setAttribute("aria-pressed", String(settings.theme === key));
        button.innerHTML = `
          <span class="swatches" aria-hidden="true">
            <i style="background:${theme.fur || theme.shirt}"></i>
            <i style="background:${theme.mane || theme.accent2}"></i>
            <i style="background:${theme.spot || theme.pants}"></i>
          </span>
          <span class="palette-name">${theme.label}</span>
        `;
        button.addEventListener("click", () => setTheme(key));
        paletteGrid.appendChild(button);
      });
    }

    function renderPetList() {
      const list = document.getElementById("petList");
      list.textContent = "";
      pets.forEach((pet) => {
        const item = document.createElement("div");
        item.className = "pet-item";
        item.dataset.petId = pet.id;
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-pressed", String(pet.id === settings.petId));
        item.innerHTML = `
          <span>
            <strong>${pet.name}</strong>
            <small>${pet.locked ? "默认宠物" : "模型生成"}</small>
          </span>
        `;
        item.addEventListener("click", () => selectPet(pet.id));
        item.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPet(pet.id);
          }
        });

        if (!pet.locked) {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "pet-delete";
          remove.setAttribute("aria-label", `删除 ${pet.name}`);
          remove.textContent = "×";
          remove.addEventListener("click", (event) => {
            event.stopPropagation();
            deletePet(pet.id);
          });
          item.appendChild(remove);
        }

        list.appendChild(item);
      });
    }

    function selectPet(id) {
      const pet = pets.find((item) => item.id === id) || pets[0];
      settings.petId = pet.id;
      settings.petName = pet.name;
      applyTheme();
      renderPetList();
      syncUI();
    }

    function deletePet(id) {
      const pet = pets.find((item) => item.id === id);
      if (!pet || pet.locked) return;
      pets = pets.filter((item) => item.id !== id);
      if (settings.petId === id) {
        settings.petId = DEFAULT_PET_ID;
        settings.petName = pets[0].name;
      }
      savePets();
      applyTheme();
      renderPetList();
      syncUI();
    }

    function updateActivePetName(name) {
      const cleanName = (name || "桌宠").slice(0, 12);
      const pet = getActivePet();
      settings.petName = cleanName;
      pet.name = cleanName;
      if (!pet.locked) savePets();
      renderPetList();
      syncUI();
    }

    let pendingPetImage = null;
    let pendingPetFileName = "";

    function bindPetGeneratorControls() {
      const input = document.getElementById("petImageInput");
      const button = document.getElementById("generatePetButton");
      input.addEventListener("change", async () => {
        const file = input.files?.[0];
        if (!file) return;
        pendingPetFileName = file.name;
        button.disabled = true;
        setGeneratorStatus("正在压缩参考图，避免大图请求失败...");
        try {
          pendingPetImage = await readImageAsModelDataUrl(file);
          renderUploadPreview(pendingPetImage);
          button.disabled = false;
          setGeneratorStatus("参考图已载入并压缩，准备调用模型服务。");
        } catch (error) {
          pendingPetImage = null;
          setGeneratorStatus(`图片载入失败：${error.message || "无法读取图片"}`, true);
        }
      });

      button.addEventListener("click", generatePetFromImage);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function readImageAsModelDataUrl(file) {
      const original = await readFileAsDataUrl(file);
      if (file.size < 5 * 1024 * 1024) return original;
      return compressImageDataUrl(original, 1280, 0.86);
    }

    function compressImageDataUrl(dataUrl, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          const ratio = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
          const width = Math.max(1, Math.round(image.naturalWidth * ratio));
          const height = Math.max(1, Math.round(image.naturalHeight * ratio));
          const temp = document.createElement("canvas");
          temp.width = width;
          temp.height = height;
          const tempCtx = temp.getContext("2d");
          tempCtx.imageSmoothingEnabled = true;
          tempCtx.imageSmoothingQuality = "high";
          tempCtx.drawImage(image, 0, 0, width, height);
          resolve(temp.toDataURL("image/jpeg", quality));
        };
        image.onerror = () => reject(new Error("图片无法解码"));
        image.src = dataUrl;
      });
    }

    function renderUploadPreview(dataUrl) {
      const hint = document.getElementById("uploadHint");
      hint.textContent = "";
      const image = document.createElement("img");
      image.src = dataUrl;
      image.alt = "参考图预览";
      hint.appendChild(image);
    }

    function setGeneratorStatus(text, isError = false) {
      const status = document.getElementById("generatorStatus");
      status.textContent = text;
      status.style.color = isError ? "#c2413c" : "";
    }

    async function generatePetFromImage() {
      if (!pendingPetImage) return;
      const button = document.getElementById("generatePetButton");
      button.disabled = true;
      setGeneratorStatus("正在调用视觉模型生成桌宠配置...");
      try {
        const response = await fetch(PET_GENERATOR_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            imageDataUrl: pendingPetImage,
            desiredName: document.getElementById("petNameInput").value.trim(),
            sourceName: pendingPetFileName
          })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || `模型服务返回 ${response.status}`);
        }
        const pet = normalizePet({
          ...payload.pet,
          id: `pet-${Date.now()}`,
          createdAt: new Date().toISOString(),
          sourceName: pendingPetFileName,
          locked: false
        });
        pets.push(pet);
        settings.petId = pet.id;
        settings.petName = pet.name;
        savePets();
        applyTheme();
        renderPetList();
        syncUI();
        setGeneratorStatus(`已生成并保存为${getAvatarTypeLabel(pet)}桌宠。`);
      } catch (error) {
        setGeneratorStatus(`生成失败：${error.message}。需要启动本地模型服务并配置 OPENAI_API_KEY。`, true);
      } finally {
        button.disabled = false;
      }
    }

    function getAvatarTypeLabel(pet) {
      return pet.profile?.features?.avatarType === "human" ? "人形" : "兽类";
    }

    function setState(key) {
      settings.state = key;
      settings.viewGroupIndex = findGroupIndexForState(key);
      syncUI();
    }

    function setTheme(key) {
      settings.theme = key;
      applyTheme();
      syncUI();
    }

    function applyTheme() {
      const theme = getActivePalette(settings.theme);
      const appBg = colorMix(theme.stage, "#eaf2fb", 0.34);
      const appBgDeep = colorMix(theme.accent, "#eef5fb", 0.82);
      const uiAccent = theme.accent2 || theme.accent;
      const uiAccentSoft = colorMix(theme.accent, "#ffffff", 0.84);
      const line = colorMix(theme.stage, "#dfe6ef", 0.56);
      document.documentElement.style.setProperty("--accent", theme.accent);
      document.documentElement.style.setProperty("--accent-2", theme.accent2);
      document.documentElement.style.setProperty("--danger", theme.danger);
      document.documentElement.style.setProperty("--stage", theme.stage);
      document.documentElement.style.setProperty("--stage-grid", hexToRgba(theme.inkSoft || theme.ink, 0.10));
      document.documentElement.style.setProperty("--focus", hexToRgba(theme.accent, 0.26));
      document.documentElement.style.setProperty("--ui-accent", uiAccent);
      document.documentElement.style.setProperty("--ui-accent-soft", uiAccentSoft);
      document.documentElement.style.setProperty("--ui-focus", hexToRgba(uiAccent, 0.18));
      document.documentElement.style.setProperty("--app-bg", appBg);
      document.documentElement.style.setProperty("--app-bg-deep", appBgDeep);
      document.documentElement.style.setProperty("--line", line);
      document.documentElement.style.setProperty("--glass-line", hexToRgba(theme.inkSoft || theme.ink, 0.20));
      document.documentElement.style.setProperty("--theme-shadow", hexToRgba(theme.ink || "#243447", 0.11));
      document.documentElement.style.setProperty("--theme-wash-1", hexToRgba(theme.accent, 0.11));
      document.documentElement.style.setProperty("--theme-wash-2", hexToRgba(theme.accent2 || theme.accent, 0.08));
      document.documentElement.style.setProperty("--theme-wash-3", hexToRgba(theme.maneLight || theme.belly || theme.accent, 0.07));
    }

    function syncUI() {
      const state = states[settings.state];
      const groupIndex = findGroupIndexForState(settings.state);
      const group = stateGroups[groupIndex];
      document.getElementById("petNameLabel").textContent = settings.petName || "桌宠";
      const petNameInput = document.getElementById("petNameInput");
      if (document.activeElement !== petNameInput) {
        petNameInput.value = settings.petName || "桌宠";
      }
      document.getElementById("stateLine").textContent = state.line;
      document.getElementById("currentActionGroup").textContent = group.title;
      document.getElementById("currentActionTitle").textContent = state.label;
      document.getElementById("currentActionLine").textContent = state.line;
      document.getElementById("speedValue").textContent = `${settings.speed.toFixed(2)}×`;
      document.getElementById("intensityValue").textContent = `${settings.intensity.toFixed(2)}×`;

      document.querySelectorAll("[data-state]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.state === settings.state));
      });
      document.querySelectorAll("[data-theme]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.theme === settings.theme));
      });
      document.querySelectorAll("[data-group-index]").forEach((element) => {
        element.classList.toggle("active", element.dataset.groupIndex === String(settings.viewGroupIndex));
        if (element.classList.contains("state-tab")) {
          element.setAttribute("aria-pressed", String(element.dataset.groupIndex === String(settings.viewGroupIndex)));
        }
      });
      document.getElementById("stage").classList.toggle("no-grid", !settings.grid);
    }

    function bindControls() {
      const speedRange = document.getElementById("speedRange");
      const intensityRange = document.getElementById("intensityRange");
      const petNameInput = document.getElementById("petNameInput");
      petNameInput.addEventListener("input", () => {
        updateActivePetName(petNameInput.value.trim() || "桌宠");
      });
      speedRange.addEventListener("input", () => {
        settings.speed = Number(speedRange.value);
        syncUI();
      });
      intensityRange.addEventListener("input", () => {
        settings.intensity = Number(intensityRange.value);
        syncUI();
      });
      document.getElementById("motionToggle").addEventListener("change", (event) => {
        settings.motion = event.target.checked;
        syncUI();
      });
      document.getElementById("effectToggle").addEventListener("change", (event) => {
        settings.effects = event.target.checked;
        syncUI();
      });
      document.getElementById("gridToggle").addEventListener("change", (event) => {
        settings.grid = event.target.checked;
        syncUI();
      });
      document.getElementById("randomButton").addEventListener("click", randomize);
      document.getElementById("exportButton").addEventListener("click", exportPng);
      bindPetGeneratorControls();
    }

    function randomize() {
      settings.state = stateOrder[Math.floor(Math.random() * stateOrder.length)];
      settings.viewGroupIndex = findGroupIndexForState(settings.state);
      const themeKeys = Object.keys(themes);
      settings.theme = themeKeys[Math.floor(Math.random() * themeKeys.length)];
      settings.speed = Number((0.65 + Math.random() * 0.95).toFixed(2));
      settings.intensity = Number((0.55 + Math.random() * 0.95).toFixed(2));
      document.getElementById("speedRange").value = settings.speed;
      document.getElementById("intensityRange").value = settings.intensity;
      applyTheme();
      syncUI();
      note("已生成一组新组合");
    }

    function exportPng() {
      const output = document.createElement("canvas");
      const scale = 8;
      output.width = PREVIEW_WIDTH * scale;
      output.height = PREVIEW_HEIGHT * scale;
      const outputCtx = output.getContext("2d");
      outputCtx.imageSmoothingEnabled = false;
      const temp = document.createElement("canvas");
      temp.width = PREVIEW_WIDTH;
      temp.height = PREVIEW_HEIGHT;
      const tempCtx = temp.getContext("2d");
      tempCtx.imageSmoothingEnabled = false;
      drawCharacter(tempCtx, settings.state, settings.theme, (performance.now() - startTime) / 1000, settings);
      outputCtx.drawImage(temp, 0, 0, output.width, output.height);

      const link = document.createElement("a");
      link.download = `pixel-character-${settings.state}-${settings.theme}.png`;
      link.href = output.toDataURL("image/png");
      link.click();
      note(`PNG 已导出为 ${output.width}×${output.height}`);
    }

    function note(text) {
      const el = document.getElementById("copyNote");
      el.textContent = text;
      window.clearTimeout(note.timer);
      note.timer = window.setTimeout(() => {
        el.textContent = "";
      }, 1800);
    }

    function loop(now) {
      const time = (now - startTime) / 1000;
      drawCharacter(ctx, settings.state, settings.theme, time, settings);
      requestAnimationFrame(loop);
    }

    renderPetList();
    createStateButtons();
    createPaletteButtons();
    bindControls();
    applyTheme();
    syncUI();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
