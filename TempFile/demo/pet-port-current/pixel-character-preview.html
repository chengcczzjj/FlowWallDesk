<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灵月 · LingyueDesk 桌宠预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eaf2fb;
      --panel: #ffffff;
      --panel-2: #ffffff;
      --line: #dfe6ef;
      --text: #202733;
      --muted: #65707e;
      --soft: #98a3af;
      --accent: #6ee7d8;
      --accent-2: #f4cf5d;
      --danger: #ff6b6b;
      --stage: #fff7e8;
      --stage-grid: rgba(95, 78, 60, 0.11);
      --focus: rgba(110, 231, 216, 0.28);
      --ui-accent: #0873d1;
      --ui-accent-soft: #e8f1ff;
      --ui-focus: rgba(8, 115, 209, 0.16);
      --app-bg: #eaf2fb;
      --app-bg-deep: #dce9f7;
      --glass: rgba(255, 255, 255, 0.58);
      --glass-strong: rgba(255, 255, 255, 0.76);
      --glass-line: rgba(122, 144, 169, 0.24);
      --theme-shadow: rgba(61, 82, 105, 0.13);
      --theme-wash-1: rgba(200, 121, 53, 0.11);
      --theme-wash-2: rgba(230, 72, 50, 0.08);
      --theme-wash-3: rgba(95, 142, 230, 0.07);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--app-bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      height: calc(100vh - 34px);
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) 360px;
      gap: 0;
      padding: 0;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.20)),
        linear-gradient(135deg, var(--app-bg), var(--app-bg-deep));
    }

    .app::before {
      content: "";
      position: absolute;
      inset: -18%;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(118deg, transparent 4% 27%, var(--theme-wash-1) 44%, transparent 63%),
        linear-gradient(36deg, transparent 0 32%, var(--theme-wash-2) 54%, transparent 76%),
        linear-gradient(162deg, transparent 0 18%, var(--theme-wash-3) 41%, transparent 68%);
      background-size: 160% 160%, 145% 145%, 180% 180%;
      filter: blur(52px) saturate(0.96);
      opacity: 0.56;
      transform: translate3d(0, 0, 0);
      animation: ambientThemeDrift 18s ease-in-out infinite alternate;
    }

    .app::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.34), transparent 38%, rgba(255, 255, 255, 0.20)),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 6px);
      opacity: 0.30;
      mix-blend-mode: screen;
    }

    @keyframes ambientThemeDrift {
      0% {
        background-position: 0% 18%, 100% 22%, 42% 36%;
        transform: scale(1.02) translate3d(-0.8%, 0, 0);
      }
      50% {
        background-position: 48% 42%, 56% 58%, 68% 48%;
      }
      100% {
        background-position: 100% 70%, 0% 82%, 28% 72%;
        transform: scale(1.05) translate3d(0.8%, -0.8%, 0);
      }
    }

    .preview-panel,
    .control-panel {
      border: 0;
      position: relative;
      z-index: 1;
      background: var(--glass);
      border-radius: 0;
      min-width: 0;
    }

    .preview-panel {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      background: transparent;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 21px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: 0;
    }

    .state-line {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.45;
    }

    .status-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 45%);
      background: color-mix(in srgb, var(--accent), transparent 86%);
      border-radius: 999px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      min-height: 34px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }

    .stage-shell {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      padding: 0;
      min-height: 0;
    }

    .stage {
      --ground-lift: clamp(220px, 29vh, 330px);
      position: relative;
      display: block;
      min-height: 100%;
      aspect-ratio: auto;
      width: 100%;
      height: 100%;
      justify-self: center;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background-color: transparent;
      background-image:
        linear-gradient(var(--stage-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--stage-grid) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .stage.no-grid {
      background-image: none;
    }

    .stage::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: var(--ground-lift);
      z-index: 1;
      width: clamp(220px, 24vw, 320px);
      height: 2px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: color-mix(in srgb, var(--ui-accent), rgba(93, 111, 132, 0.26) 76%);
      box-shadow: 0 10px 22px var(--theme-shadow);
      opacity: 1;
      pointer-events: none;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(105deg, transparent 5%, rgba(255, 255, 255, 0.42) 36%, transparent 62%),
        linear-gradient(16deg, transparent 18%, var(--theme-wash-3) 47%, transparent 76%);
      filter: blur(20px);
      opacity: 0.56;
      animation: stageLightSweep 14s ease-in-out infinite alternate;
    }

    @keyframes stageLightSweep {
      from {
        transform: translate3d(-4%, 1%, 0) scale(1);
      }
      to {
        transform: translate3d(4%, -2%, 0) scale(1.03);
      }
    }

    .character-canvas {
      position: absolute;
      left: 50%;
      bottom: calc(var(--ground-lift) - clamp(44px, 6.4vw, 70px));
      width: min(36vw, 400px);
      min-width: 250px;
      max-width: 400px;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: 2;
      transform: translateX(-50%);
      filter: drop-shadow(0 18px 18px var(--theme-shadow));
    }

    .readout {
      align-self: stretch;
      display: grid;
      grid-template-rows: repeat(4, auto) 1fr;
      gap: 10px;
      min-width: 0;
    }

    .metric {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 8px;
      padding: 11px 12px;
      min-width: 0;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .metric-value {
      margin-top: 5px;
      font-size: 15px;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .config-box {
      margin: 0;
      white-space: pre-wrap;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #594f47;
      min-height: 130px;
    }

    .mini-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(80px, 1fr));
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      background: #f8f0e5;
      overflow-x: auto;
    }

    .mini-button {
      display: grid;
      place-items: center;
      gap: 8px;
      min-width: 80px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 8px;
      padding: 8px 6px 9px;
      cursor: pointer;
    }

    .mini-button[aria-pressed="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .mini-button canvas {
      width: 54px;
      height: 54px;
      image-rendering: pixelated;
    }

    .mini-button span {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.2;
    }

    .windowbar {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--glass-line);
      background: color-mix(in srgb, var(--app-bg), #ffffff 68%);
      color: #60656c;
      font-size: 13px;
      user-select: none;
    }

    .window-actions {
      display: flex;
      gap: 22px;
      color: #73777f;
      font-size: 18px;
      line-height: 1;
    }

    .side-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 28px 0 20px;
      position: relative;
      z-index: 1;
      background: color-mix(in srgb, var(--glass-strong), var(--app-bg) 26%);
      border-right: 1px solid var(--glass-line);
      backdrop-filter: blur(22px) saturate(1.22);
      -webkit-backdrop-filter: blur(22px) saturate(1.22);
    }

    .rail-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #6b7078;
      cursor: pointer;
    }

    .rail-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rail-button.active {
      position: relative;
      background: var(--ui-accent-soft);
      color: var(--ui-accent);
    }

    .rail-button.active::before {
      content: "";
      position: absolute;
      left: -7px;
      width: 4px;
      height: 24px;
      border-radius: 999px;
      background: var(--ui-accent);
    }

    .rail-spacer {
      flex: 1;
    }

    .pet-caption {
      position: absolute;
      left: 50%;
      bottom: calc(var(--ground-lift) - 132px);
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 3;
    }

    .pet-caption .pet-icon {
      display: block;
      color: rgba(95, 101, 109, 0.46);
      font-size: 35px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .pet-caption strong {
      display: block;
      color: #666b72;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 680;
    }

    .pet-caption span {
      display: block;
      margin-top: 10px;
      color: #a0a5ad;
      font-size: 15px;
    }

    .state-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .state-group {
      display: grid;
      gap: 8px;
    }

    .state-dock {
      min-height: 176px;
      max-height: min(28vh, 240px);
      display: grid;
      grid-template-columns: minmax(220px, 0.8fr) minmax(0, 2.4fr);
      gap: 16px;
      margin: 0 22px 18px;
      padding: 16px;
      overflow: hidden;
      border: 1px solid var(--glass-line);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.64), rgba(255, 255, 255, 0.34)),
        color-mix(in srgb, var(--glass), var(--app-bg) 18%);
      box-shadow: 0 20px 52px var(--theme-shadow);
      backdrop-filter: blur(26px) saturate(1.32);
      -webkit-backdrop-filter: blur(26px) saturate(1.32);
      z-index: 4;
    }

    .action-summary {
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--glass-line), #ffffff 26%);
      border-radius: 12px;
      background:
        linear-gradient(135deg, var(--ui-accent-soft), rgba(255, 255, 255, 0.58));
      padding: 16px;
      display: grid;
      align-content: center;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
    }

    .action-kicker {
      color: var(--ui-accent);
      font-size: 12px;
      font-weight: 760;
      line-height: 1.2;
    }

    .action-title {
      color: var(--text);
      font-size: 22px;
      font-weight: 760;
      line-height: 1.15;
    }

    .action-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .action-picker {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
    }

    .state-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .state-tab {
      flex: 0 0 auto;
      min-height: 34px;
      border: 1px solid color-mix(in srgb, var(--glass-line), #ffffff 18%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--muted);
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 680;
    }

    .state-tab[aria-pressed="true"] {
      border-color: var(--ui-accent);
      background: var(--ui-accent-soft);
      color: #0c4f91;
    }

    .state-list {
      display: grid;
      min-width: 0;
      min-height: 0;
    }

    .state-group {
      display: none;
      min-width: 0;
      gap: 10px;
    }

    .state-group.active {
      display: grid;
    }

    .state-group-title {
      display: none;
    }

    .control-panel {
      overflow: auto;
      margin: 0;
      padding: 18px;
      border: 0;
      border-left: 1px solid var(--line);
      border-radius: 0;
      background: color-mix(in srgb, var(--app-bg), #ffffff 76%);
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .tool-section {
      padding: 12px 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .tool-section:first-child {
      padding-top: 0;
    }

    .tool-section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    h2 {
      font-size: 13px;
      color: var(--muted);
      font-weight: 680;
      letter-spacing: 0;
      margin-bottom: 10px;
    }

    .state-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      gap: 10px;
      align-content: start;
      overflow: auto;
      padding: 2px 2px 4px;
    }

    .state-button,
    .action-button {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--glass-strong), #ffffff 18%);
      border-radius: 8px;
      min-height: 62px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .state-button:hover,
    .action-button:hover,
    .mini-button:hover {
      border-color: color-mix(in srgb, var(--ui-accent), var(--line) 30%);
    }

    .state-button:active,
    .action-button:active,
    .mini-button:active {
      transform: translateY(1px);
    }

    .state-button[aria-pressed="true"] {
      background: var(--ui-accent-soft);
      border-color: var(--ui-accent);
      box-shadow: 0 0 0 3px var(--ui-focus);
    }

    .button-main {
      display: block;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 680;
    }

    .button-sub {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .button-mark {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 2px;
      background: #b8c4d1;
    }

    .state-button[aria-pressed="true"] .button-mark {
      background: var(--ui-accent);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .palette-button {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--glass-strong), #ffffff 16%);
      border-radius: 8px;
      min-height: 58px;
      padding: 8px;
      cursor: pointer;
      display: grid;
      gap: 8px;
    }

    .palette-button[aria-pressed="true"] {
      border-color: var(--ui-accent);
      box-shadow: 0 0 0 3px var(--ui-focus);
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .swatches i {
      display: block;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .palette-name {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .text-input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--text);
      padding: 8px 10px;
      outline: 0;
    }

    .text-input:focus {
      border-color: var(--ui-accent);
      box-shadow: 0 0 0 3px var(--ui-focus);
    }

    .pet-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .pet-item {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

    .pet-item[aria-pressed="true"] {
      border-color: var(--ui-accent);
      background: var(--ui-accent-soft);
      box-shadow: 0 0 0 3px var(--ui-focus);
    }

    .pet-item span {
      display: block;
      min-width: 0;
    }

    .pet-item strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pet-item small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    .pet-delete {
      width: 24px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.68);
      color: #8893a0;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .generator-box {
      display: grid;
      gap: 10px;
    }

    .upload-card {
      min-height: 96px;
      border: 1px dashed color-mix(in srgb, var(--ui-accent), var(--line) 48%);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.50);
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 10px;
    }

    .upload-card img {
      width: 100%;
      max-height: 132px;
      object-fit: contain;
      image-rendering: auto;
    }

    .upload-card input {
      display: none;
    }

    .generator-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .generator-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .control-row {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .control-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--ui-accent);
    }

    .toggle-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .toggle {
      position: relative;
    }

    .toggle input {
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    .toggle span {
      display: grid;
      place-items: center;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.56);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .toggle input:checked + span {
      color: var(--text);
      border-color: var(--ui-accent);
      background: var(--ui-accent-soft);
    }

    .action-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action-button {
      justify-content: center;
      text-align: center;
      min-height: 44px;
      font-weight: 680;
    }

    .copy-note {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;

      const base = createDefaultPet();
      const safe = pet && typeof pet === "object" ? pet : {};
      const rawFeatures = safe.profile?.features || safe.features || {};
      return {
        id: safe.id || `pet-${Date.now()}`,
        name: (safe.name || "新桌宠").slice(0, 12),

          palette: normalizePalette(safe.profile?.palette || safe.palette || {}),
          features: normalizeFeatures(rawFeatures, base.profile.features)

    function normalizeFeatures(features, fallback) {
      const safe = features && typeof features === "object" ? features : {};
      const avatarType = ["human", "mascot"].includes(safe.avatarType) ? safe.avatarType : fallback.avatarType;
      const normalized = {
        avatarType,
        characterStyle: pickFeature(safe.characterStyle, ["blueCompanion", "generic"], fallback.characterStyle || "generic"),
        earShape: pickFeature(safe.earShape, ["round", "pointy", "long", "none"], fallback.earShape),
        maneStyle: pickFeature(safe.maneStyle, ["mohawk", "fluffy", "bangs", "long", "none"], fallback.maneStyle),

        vibe: pickFeature(safe.vibe, ["confident", "cute", "cool", "gentle", "mysterious"], fallback.vibe)
      };
      if (normalized.avatarType === "human") {
        normalized.earShape = "none";
        if (normalized.tailStyle !== "none") normalized.tailStyle = "none";
        if (normalized.spotStyle !== "none") normalized.spotStyle = "none";
        if (normalized.maneStyle === "mohawk") normalized.maneStyle = "long";
        if (normalized.accessory === "sunglasses") normalized.accessory = "none";
      }
      return normalized;

    function pickFeature(value, allowed, fallback) {
      return allowed.includes(value) ? value : fallback;

    function normalizePalette(palette) {
      const fallback = themes.moon;

        "accent", "accent2", "danger", "ink", "inkSoft", "fur", "furDark", "belly",
        "muzzle", "mane", "maneLight", "earInner", "spot", "lens", "lensLight",
        "blush", "fang", "shirt", "pants", "shoe"
      ];
      return keys.reduce((result, key) => {
        result[key] = isHexColor(palette[key]) ? palette[key] : fallback[key];
        return result;
      }, {});

    function isHexColor(value) {
      return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);

    function loadSavedPets() {
      try {
        const saved = JSON.parse(localStorage.getItem(PET_STORAGE_KEY) || "[]");
        const defaultPets = createDefaultPets();
        const defaultIds = new Set(defaultPets.map((pet) => pet.id));
        return [...defaultPets, ...saved.filter((pet) => !defaultIds.has(pet?.id)).map(normalizePet)];
      } catch (error) {
        return createDefaultPets();
      }
    }

    function savePets() {
      const generated = pets.filter((pet) => !pet.locked);
      localStorage.setItem(PET_STORAGE_KEY, JSON.stringify(generated));
    }

    function getActivePet() {
      return pets.find((pet) => pet.id === settings.petId) || pets[0];
    }

    function getActivePalette(themeKey) {
      const pet = getActivePet();
      const base = pet.locked ? themes[themeKey] : themes.moon;
      return {
        ...base,
        ...(pet.profile?.palette || {})
      };
    }

    function getActiveFeatures() {
      return getActivePet().profile?.features || createDefaultPet().profile.features;
    }

    function getHumanPalette(palette) {
      const skin = palette.skin || palette.muzzle || "#efcfc3";
      const hair = palette.hair || palette.mane || palette.fur;
      const hairLight = palette.hairLight || palette.maneLight || colorMix(hair, "#ffffff", 0.28);
      return {
        ...palette,
        skin,
        skinDark: palette.skinDark || colorMix(skin, "#b98579", 0.34),
        hair,
        hairLight,
        shirtDark: palette.shirtDark || colorMix(palette.shirt || "#f5efe7", "#9aaeba", 0.20),
        skirt: palette.skirt || colorMix(palette.shirt || "#f5efe7", palette.accent || "#78cbe8", 0.08)
      };
    }

    let pets = loadSavedPets();

    const settings = {
      petId: DEFAULT_PET_ID,
      petName: pets[0]?.name || "桌宠",
      state: "idle",
      viewGroupIndex: 2,
      theme: "moon",
      speed: 1,
      intensity: 1,
      motion: true,
      effects: true,
      grid: true
    };

    let startTime = performance.now();

    function snapPixel(value) {
      return Math.round(value * PIXEL_DENSITY) / PIXEL_DENSITY;
    }

    function px(target, x, y, w, h, color) {
      target.fillStyle = color;
      target.fillRect(
        snapPixel(x),
        snapPixel(y),
        Math.max(1 / PIXEL_DENSITY, snapPixel(w)),
        Math.max(1 / PIXEL_DENSITY, snapPixel(h))
      );
    }

    const pixelGlyphs = {
      "?": ["1110", "0001", "0010", "0100", "0000", "0100"],
      "!": ["1", "1", "1", "1", "0", "1"],
      "Z": ["111", "001", "010", "100", "111"],
      "0": ["111", "101", "101", "101", "111"],
      "1": ["010", "110", "010", "010", "111"]
    };

    function drawPixelText(target, x, y, glyph, color, scale = 1) {
      const map = pixelGlyphs[glyph];
      if (!map) return;
      map.forEach((row, rowIndex) => {
        [...row].forEach((cell, colIndex) => {
          if (cell === "1") px(target, x + colIndex * scale, y + rowIndex * scale, scale, scale, color);
        });
      });
    }

    function drawPixelString(target, x, y, text, color, scale = 1, gap = 1) {
      let cursor = x;
      [...String(text)].forEach((glyph) => {
        if (glyph === " ") {
          cursor += 3 * scale + gap;
          return;
        }
        const map = pixelGlyphs[glyph];
        if (!map) {
          cursor += 3 * scale + gap;
          return;
        }
        drawPixelText(target, cursor, y, glyph, color, scale);
        const width = Math.max(...map.map((row) => row.length)) * scale;
        cursor += width + gap;
      });
    }

    function drawShadow(target, phase, palette, options, lift = 0) {
      const jumpSpread = Math.max(0, Math.abs(lift));
      const walkPulse = options.motion ? Math.abs(Math.sin(phase * 2)) : 0;
      const width = 22 + Math.round(walkPulse * 2) - Math.round(jumpSpread * 0.8);
      px(target, 24 - width / 2, 42, width, 1, "rgba(82, 55, 39, 0.20)");
      px(target, 19, 43, 10, 1, "rgba(82, 55, 39, 0.12)");
    }

    function drawLegs(target, palette, tick) {
      const step = tick % 2;
      const ink = palette.ink || "#17171b";
      px(target, 19, 33, 4, 8, ink);
      px(target, 26, 33, 4, 8, ink);
      px(target, 20, 33, 2, 8, palette.skin);
      px(target, 27, 33, 2, 8, palette.skin);
      px(target, 19, 38, 4, 3, palette.shoe);
      px(target, 26, 38, 4, 3, palette.shoe);
      px(target, 18 + step, 40, 6, 2, palette.shoe);
      px(target, 26 - step, 40, 6, 2, palette.shoe);
    }

    function drawBody(target, palette, features = {}) {
      const ink = palette.ink || "#17171b";
      px(target, 21, 22, 7, 4, ink);
      px(target, 22, 22, 5, 4, palette.skin);
      if (features.avatarType === "human") {
        px(target, 17, 25, 15, 11, ink);
        px(target, 18, 25, 13, 10, palette.shirt);
        px(target, 16, 26, 4, 5, ink);
        px(target, 29, 26, 4, 5, ink);
        px(target, 17, 26, 3, 4, palette.shirt);
        px(target, 29, 26, 3, 4, palette.shirt);
        px(target, 19, 25, 11, 3, colorMix(palette.shirt, "#ffffff", 0.40));
        px(target, 20, 28, 9, 5, colorMix(palette.shirt, palette.skin, 0.06));
        px(target, 18, 33, 13, 3, palette.shirtDark);
        px(target, 19, 36, 12, 2, ink);
        px(target, 20, 35, 10, 3, palette.skirt || palette.shirtDark);
        px(target, 23, 25, 3, 1, colorMix(palette.skin, "#ffffff", 0.18));
        px(target, 22, 28, 5, 1, colorMix(palette.shirt, "#ffffff", 0.48));
        return;
      }
      px(target, 17, 24, 15, 10, ink);
      px(target, 18, 24, 13, 10, palette.shirt);
      px(target, 19, 24, 4, 2, colorMix(palette.shirt, "#ffffff", 0.34));
      px(target, 26, 24, 4, 2, colorMix(palette.shirt, "#ffffff", 0.18));
      px(target, 18, 30, 13, 2, palette.shirtDark);
      px(target, 16, 33, 17, 5, ink);
      px(target, 17, 32, 15, 6, palette.skirt || palette.pants);
      px(target, 16, 37, 17, 2, palette.skirt || palette.pants);
      px(target, 19, 32, 11, 1, colorMix(palette.skirt || palette.pants, "#ffffff", 0.18));
      px(target, 22, 27, 5, 1, colorMix(palette.shirt, "#ffffff", 0.42));
      px(target, 17, 38, 15, 1, ink);
    }

    function drawBackHair(target, palette, headTilt, phase, options, features = {}) {
      const ink = palette.ink || "#17171b";
      const sway = options.motion ? Math.round(Math.sin(phase * 1.3) * options.intensity) : 0;
      target.save();
      target.translate(headTilt + sway, 0);
      if (features.maneStyle === "long") {
        px(target, 12, 7, 24, 6, ink);
        px(target, 11, 12, 26, 8, ink);
        px(target, 10, 19, 9, 20, ink);
        px(target, 30, 18, 9, 23, ink);
        px(target, 12, 38, 7, 4, ink);
        px(target, 31, 40, 7, 4, ink);
        px(target, 13, 8, 22, 5, palette.hair);
        px(target, 12, 13, 24, 7, palette.hair);
        px(target, 11, 20, 7, 18, palette.hair);
        px(target, 31, 19, 7, 21, palette.hair);
        px(target, 13, 38, 5, 3, colorMix(palette.hair, "#000000", 0.12));
        px(target, 32, 40, 5, 3, colorMix(palette.hair, "#000000", 0.16));
        px(target, 15, 10, 6, 1, palette.hairLight);
        px(target, 16, 13, 3, 22, palette.hairLight);
        px(target, 29, 14, 2, 22, colorMix(palette.hairLight, palette.hair, 0.28));
        px(target, 34, 19, 2, 17, palette.hairLight);
        target.restore();
        return;
      }
      px(target, 14, 9, 21, 4, ink);
      px(target, 13, 12, 23, 5, ink);
      px(target, 12, 16, 7, 16, ink);
      px(target, 30, 16, 7, 16, ink);
      px(target, 13, 31, 5, 5, ink);
      px(target, 31, 31, 5, 5, ink);

      px(target, 15, 9, 19, 4, palette.hair);
      px(target, 14, 12, 21, 4, palette.hair);
      px(target, 13, 16, 5, 15, palette.hair);
      px(target, 31, 16, 5, 15, palette.hair);
      px(target, 14, 31, 4, 4, colorMix(palette.hair, "#000000", 0.12));
      px(target, 32, 31, 3, 4, colorMix(palette.hair, "#000000", 0.16));
      px(target, 16, 11, 3, 18, palette.hairLight || colorMix(palette.hair, "#ffffff", 0.22));
      px(target, 29, 12, 2, 17, colorMix(palette.hair, "#ffffff", 0.12));
      px(target, 18, 34, 2, 1, colorMix(palette.hair, "#ffffff", 0.12));
      px(target, 30, 34, 2, 1, colorMix(palette.hair, "#ffffff", 0.10));
      target.restore();
    }

    function drawArms(target, palette, armType, phase, options) {
      const alt = Math.floor(phase * 6) % 2;
      const ink = palette.ink || "#17171b";
      if (armType === "wave") {
        px(target, 14, 25, 3, 8, ink);
        px(target, 14, 26, 2, 6, palette.skin);
        px(target, 32, 20 - alt, 3, 8, ink);
        px(target, 33, 18 - alt, 2, 8, palette.skin);
        px(target, 35, 17 - alt, 3, 2, palette.skin);
        return;
      }

      if (armType === "think") {
        px(target, 14, 26, 3, 7, ink);
        px(target, 15, 27, 2, 5, palette.skin);
        px(target, 31, 26, 3, 6, ink);
        px(target, 30, 24, 4, 4, palette.skin);
        px(target, 30, 23, 3, 2, palette.skinDark);
        return;
      }

      if (armType === "type") {
        px(target, 14, 27 + alt, 5, 3, ink);
        px(target, 15, 27 + alt, 4, 2, palette.skin);
        px(target, 30, 28 - alt, 5, 3, ink);
        px(target, 30, 28 - alt, 4, 2, palette.skin);
        px(target, 16, 36, 17, 2, ink);
        px(target, 18, 35, 13, 1, palette.inkSoft || "#62606a");
        px(target, 20 + alt * 5, 34, 2, 1, palette.accent2);
        return;
      }

      if (armType === "swipe") {
        px(target, 14, 26, 3, 8, ink);
        px(target, 15, 27, 2, 6, palette.skin);
        px(target, 30, 24 - alt, 7, 3, ink);
        px(target, 30, 24 - alt, 6, 2, palette.skin);
        px(target, 36, 23 - alt, 2, 2, palette.skin);
        return;
      }

      if (armType === "panic") {
        px(target, 12, 19, 3, 9, ink);
        px(target, 13, 17, 2, 10, palette.skin);
        px(target, 34, 19, 3, 9, ink);
        px(target, 34, 17, 2, 10, palette.skin);
        px(target, 11, 16, 4, 2, palette.skin);
        px(target, 34, 16, 4, 2, palette.skin);
        return;
      }

      if (armType === "shrug") {
        px(target, 12, 25, 5, 4, ink);
        px(target, 12, 24, 4, 3, palette.skin);
        px(target, 32, 25, 5, 4, ink);
        px(target, 33, 24, 4, 3, palette.skin);
        return;
      }

      if (armType === "sleep") {
        px(target, 13, 29, 8, 3, ink);
        px(target, 14, 29, 7, 2, palette.skin);
        px(target, 28, 29, 8, 3, ink);
        px(target, 28, 29, 7, 2, palette.skin);
        return;
      }

      px(target, 14, 28, 4, 7, ink);
      px(target, 15, 29, 2, 5, palette.skin);
      px(target, 31, 28, 4, 7, ink);
      px(target, 32, 29, 2, 5, palette.skin);
      px(target, 14, 34, 3, 2, palette.skinDark);
      px(target, 32, 34, 3, 2, palette.skinDark);
    }

    function drawHead(target, palette, headTilt, features = {}) {
      const ink = palette.ink || "#17171b";
      target.save();
      target.translate(headTilt, 0);
      px(target, 13, 16, 3, 6, ink);
      px(target, 33, 16, 3, 6, ink);
      px(target, 14, 17, 2, 4, palette.skinDark);
      px(target, 33, 17, 2, 4, palette.skinDark);

      px(target, 15, 10, 19, 2, ink);
      px(target, 14, 12, 21, 12, ink);
      px(target, 15, 24, 19, 2, ink);
      px(target, 16, 11, 17, 2, palette.skin);
      px(target, 15, 13, 19, 9, palette.skin);
      px(target, 16, 22, 17, 3, colorMix(palette.skin, palette.skinDark, 0.22));
      px(target, 18, 24, 13, 1, colorMix(palette.skin, "#ffffff", 0.16));

      if (features.maneStyle === "long") {
        px(target, 13, 7, 23, 6, ink);
        px(target, 12, 12, 24, 6, ink);
        px(target, 12, 17, 5, 7, ink);
        px(target, 31, 16, 5, 8, ink);
        px(target, 14, 8, 21, 5, palette.hair);
        px(target, 13, 13, 22, 5, palette.hair);
        px(target, 13, 17, 4, 6, palette.hair);
        px(target, 31, 17, 4, 7, palette.hair);
        px(target, 16, 8, 6, 2, palette.hairLight || colorMix(palette.hair, "#ffffff", 0.22));
        px(target, 22, 9, 8, 1, colorMix(palette.hairLight || palette.hair, "#ffffff", 0.18));
        px(target, 17, 12, 5, 8, palette.hair);
        px(target, 20, 12, 5, 6, colorMix(palette.hair, "#ffffff", 0.08));
        px(target, 25, 12, 5, 5, palette.hair);
        px(target, 29, 13, 3, 7, colorMix(palette.hair, "#000000", 0.08));
        px(target, 23, 12, 3, 10, palette.hairLight || colorMix(palette.hair, "#ffffff", 0.22));
      } else {
        px(target, 14, 8, 21, 5, ink);
        px(target, 15, 8, 19, 4, palette.hair);
        px(target, 15, 12, 5, 5, palette.hair);
        px(target, 20, 10, 9, 3, palette.hair);
        px(target, 29, 11, 5, 6, palette.hair);
        px(target, 14, 14, 3, 9, palette.hair);
        px(target, 32, 14, 3, 9, palette.hair);
        px(target, 17, 8, 4, 2, palette.hairLight || colorMix(palette.hair, "#ffffff", 0.22));
        px(target, 22, 8, 8, 1, colorMix(palette.hair, "#ffffff", 0.18));
        px(target, 31, 12, 2, 4, colorMix(palette.hair, "#000000", 0.12));
        px(target, 13, 15, 2, 7, colorMix(palette.hair, "#000000", 0.08));
      }
      target.restore();
    }

    function drawHumanAccessory(target, palette, features, headTilt) {
      if (features.accessory !== "flower") return;
      target.save();
      target.translate(headTilt, 0);
      px(target, 31, 7, 3, 2, palette.fang || "#fffdf2");
      px(target, 29, 9, 3, 2, palette.fang || "#fffdf2");
      px(target, 33, 9, 3, 2, palette.fang || "#fffdf2");
      px(target, 31, 11, 3, 2, palette.fang || "#fffdf2");
      px(target, 32, 9, 2, 2, palette.accent2);
      px(target, 33, 9, 1, 1, colorMix(palette.accent2, "#ffffff", 0.28));
      target.restore();
    }

    function drawFace(target, palette, eyes, mouth, phase, isBlink, headTilt) {
      target.save();
      target.translate(headTilt, 0);
      const dark = palette.ink || "#242027";
      const white = "#fff8ed";
      const blush = colorMix(palette.skin, "#e96f91", 0.34);

      if (isBlink && eyes !== "shock" && eyes !== "sleepy") {
        px(target, 18, 18, 5, 1, dark);
        px(target, 27, 18, 5, 1, dark);
        px(target, 22, 17, 1, 1, dark);
        px(target, 26, 17, 1, 1, dark);
      } else if (eyes === "happy") {
        px(target, 18, 18, 1, 1, dark);
        px(target, 19, 17, 3, 1, dark);
        px(target, 22, 18, 1, 1, dark);
        px(target, 27, 18, 1, 1, dark);
        px(target, 28, 17, 3, 1, dark);
        px(target, 31, 18, 1, 1, dark);
        px(target, 17, 21, 3, 1, blush);
        px(target, 30, 21, 3, 1, blush);
      } else if (eyes === "focused") {
        px(target, 18, 16, 5, 1, dark);
        px(target, 27, 16, 5, 1, dark);
        px(target, 19, 18, 4, 2, dark);
        px(target, 27, 18, 4, 2, dark);
        px(target, 21, 18, 1, 1, white);
        px(target, 29, 18, 1, 1, white);
        px(target, 17, 17, 1, 1, dark);
        px(target, 31, 17, 1, 1, dark);
      } else if (eyes === "confused") {
        px(target, 18, 16, 5, 1, dark);
        px(target, 28, 15, 4, 1, dark);
        px(target, 19, 18, 3, 2, dark);
        px(target, 28, 18, 3, 1, dark);
        px(target, 22, 18, 1, 1, white);
      } else if (eyes === "shock") {
        px(target, 18, 17, 5, 4, dark);
        px(target, 27, 17, 5, 4, dark);
        px(target, 19, 18, 3, 2, white);
        px(target, 28, 18, 3, 2, white);
        px(target, 20, 18, 1, 1, dark);
        px(target, 29, 18, 1, 1, dark);
      } else if (eyes === "sleepy") {
        px(target, 18, 18, 5, 1, dark);
        px(target, 27, 18, 5, 1, dark);
        px(target, 22, 17, 1, 1, dark);
        px(target, 26, 17, 1, 1, dark);
      } else {
        px(target, 18, 17, 5, 4, dark);
        px(target, 27, 17, 5, 4, dark);
        px(target, 19, 18, 3, 2, palette.accent);
        px(target, 28, 18, 3, 2, palette.accent);
        px(target, 20, 17, 1, 1, white);
        px(target, 29, 17, 1, 1, white);
        px(target, 17, 18, 1, 1, dark);
        px(target, 32, 18, 1, 1, dark);
      }

      const talkFrame = mouth === "talk" ? Math.floor(phase * 8) % 4 : -1;
      const effectiveMouth = mouth === "talk"
        ? (talkFrame === 0 ? "tiny" : talkFrame === 2 ? "smallOpen" : "talkOpen")
        : mouth;

      if (effectiveMouth === "talkOpen") {
        px(target, 24, 22, 4, 3, dark);
        px(target, 25, 23, 2, 1, "#d46a6a");
      } else if (effectiveMouth === "bigSmile") {
        px(target, 24, 22, 1, 1, dark);
        px(target, 25, 23, 3, 1, dark);
        px(target, 28, 22, 1, 1, dark);
        px(target, 26, 22, 1, 1, white);
      } else if (effectiveMouth === "flat" || effectiveMouth === "crying") {
        px(target, 23, 23, 4, 1, dark);
      } else if (effectiveMouth === "tiny") {
        px(target, 24, 23, 2, 1, dark);
      } else if (effectiveMouth === "smallOpen") {
        px(target, 24, 22, 3, 2, dark);
        px(target, 25, 23, 1, 1, "#d46a6a");
      } else if (effectiveMouth === "wave" || effectiveMouth === "snarl") {
        px(target, 22, 23, 1, 1, dark);
        px(target, 23, 22, 2, 1, dark);
        px(target, 25, 23, 2, 1, dark);
        px(target, 27, 22, 2, 1, dark);
      } else if (effectiveMouth === "sleep") {
        px(target, 24, 23, 1, 1, dark);
        px(target, 25, 24, 2, 1, dark);
        px(target, 27, 23, 1, 1, dark);
      } else {
        px(target, 24, 23, 3, 1, dark);
        px(target, 27, 22, 1, 1, dark);
      }
      target.restore();
    }

    function drawEffects(target, palette, fx, phase, options) {
      if (!options.effects) return;
      const active = Math.floor(phase * 3) % 3;
      if (fx === "dots") {
        [0, 1, 2].forEach((dot) => {
          const color = dot === active ? palette.accent2 : colorMix(palette.accent2, "#000000", 0.42);
          px(target, 7 + dot * 5, 7 - (dot === active ? 1 : 0), 2, 2, color);
        });
      }

      if (fx === "sparkle") {
        const lift = Math.floor(Math.sin(phase * 2) + 1);
        drawSpark(target, 11, 10 - lift, palette.accent2);
        drawSpark(target, 36, 13 + lift, palette.accent);
        drawSpark(target, 9, 29, palette.accent);
      }

      if (fx === "question") {
        const y = 5 + Math.round(Math.sin(phase * 2) * 1);
        drawPixelText(target, 40, y, "?", palette.accent2, 2);
      }

      if (fx === "exclaim") {
        drawPixelText(target, 45, 4, "!", palette.danger, 2);
        px(target, 4, 24, 3, 5, "#75d6ff");
        px(target, 5, 30, 2, 2, "#75d6ff");
      }

      if (fx === "rage") {
        const pulse = options.motion ? Math.floor(phase * 8) % 2 : 0;
        drawPixelText(target, 43, 3 - pulse, "!", palette.danger, 2);
        px(target, 7, 8, 3, 2, palette.danger);
        px(target, 10, 6, 2, 2, palette.danger);
        px(target, 6, 12, 7, 1, colorMix(palette.danger, "#000000", 0.16));
        px(target, 38, 10, 5, 2, palette.danger);
        px(target, 41, 8, 3, 2, colorMix(palette.danger, "#ffffff", 0.14));
      }

      if (fx === "tears") {
        const drop = options.motion ? Math.floor(phase * 6) % 7 : 3;
        const tear = "#59c8ff";
        px(target, 14, 23 + drop, 2, 3, tear);
        px(target, 15, 26 + drop, 1, 2, colorMix(tear, "#ffffff", 0.26));
        px(target, 33, 22 + ((drop + 3) % 7), 2, 3, tear);
        px(target, 34, 25 + ((drop + 3) % 7), 1, 2, colorMix(tear, "#ffffff", 0.26));
        px(target, 10, 36, 4, 1, "rgba(89, 200, 255, 0.42)");
        px(target, 35, 37, 5, 1, "rgba(89, 200, 255, 0.34)");
      }

      if (fx === "zzz") {
        const drift = Math.floor(phase * 2) % 3;
        drawPixelText(target, 35, 8 - drift, "Z", palette.accent, 1);
        drawPixelText(target, 40, 3 - drift, "Z", colorMix(palette.accent, "#ffffff", 0.28), 1);
      }

      if (fx === "flow") {
        const offset = Math.floor(phase * 10) % 14;
        px(target, 17 + offset, 39, 2, 1, palette.accent2);
        px(target, 31 - offset, 32, 1, 1, palette.accent);
        px(target, 12 + (offset % 8), 12, 1, 1, colorMix(palette.accent, "#ffffff", 0.25));
      }

      if (fx === "idea") {
        const lift = Math.floor(Math.sin(phase * 2) + 1);
        px(target, 42, 4 - lift, 6, 6, palette.accent2);
        px(target, 44, 3 - lift, 2, 1, colorMix(palette.accent2, "#ffffff", 0.35));
        px(target, 44, 10 - lift, 2, 2, palette.ink);
        px(target, 42, 13 - lift, 6, 1, palette.accent2);
      }

      if (fx === "music") {
        const bounce = Math.floor(phase * 4) % 2;
        px(target, 39, 5 - bounce, 2, 8, palette.accent);
        px(target, 41, 5 - bounce, 5, 2, palette.accent);
        px(target, 45, 7 - bounce, 2, 7, palette.accent);
        px(target, 37, 13 - bounce, 4, 3, palette.accent2);
        px(target, 43, 14 - bounce, 4, 3, palette.accent2);
      }

      if (fx === "book") {
        px(target, 8, 11, 2, 1, palette.accent2);
        px(target, 11, 9, 2, 1, colorMix(palette.accent2, "#ffffff", 0.18));
        px(target, 14, 12, 2, 1, palette.accent);
      }

      if (fx === "wifi") {
        const pulse = Math.floor(phase * 4) % 3;
        px(target, 42, 8, 1, 1, palette.accent);
        if (pulse >= 1) {
          px(target, 40, 6, 1, 1, palette.accent);

    function drawActionBackdrop(target, palette, state, phase, options) {
      if (!options.effects) return;
      if (state.fx === "code") {
        drawCodeBackdrop(target, palette, phase, options);
      }
      if (state.fx === "web") {
        drawWebBackdrop(target, palette, phase, options);
      }
    }

    function drawCodeBackdrop(target, palette, phase, options) {
      const streams = ["0 10", "101", "0101", "1 0", "10 1", "001"];
      const scroll = options.motion ? Math.floor(phase * 7) % 12 : 0;
      const inkGlow = colorMix(palette.accent, "#ffffff", 0.28);
      const hotGlow = colorMix(palette.accent2, "#ffffff", 0.18);
      px(target, 4, 8, 19, 40, "rgba(43, 62, 86, 0.10)");
      px(target, 56, 5, 18, 45, "rgba(43, 62, 86, 0.08)");
      px(target, 2, 48, 76, 1, "rgba(43, 62, 86, 0.08)");
      streams.forEach((text, index) => {
        const side = index % 2;
        let y = 6 + index * 9 - scroll;
        while (y < -6) y += 58;
        const x = side ? 56 + (index % 3) * 2 : 5 + (index % 3);
        const color = index === Math.floor(phase * 2) % streams.length ? hotGlow : inkGlow;
        drawPixelString(target, x, y, text, color, 1, 1);
      });
      const cursorY = 33 + (options.motion ? Math.floor(Math.sin(phase * 6) * 2) : 0);
      px(target, 61, cursorY, 9, 1, palette.accent2);
      px(target, 61, cursorY + 3, 5, 1, colorMix(palette.accent2, "#000000", 0.12));
      px(target, 6, 53, 8, 1, palette.accent);
      px(target, 67, 53, 7, 1, palette.accent2);
    }

    function drawWebBackdrop(target, palette, phase, options) {
      const drift = options.motion ? Math.floor(phase * 5) % 18 : 0;
      const cards = [
        { x: 5, y: 10, w: 18, h: 12, speed: 1 },
        { x: 55, y: 8, w: 19, h: 14, speed: -1 },
        { x: 3, y: 40, w: 21, h: 11, speed: -1 },
        { x: 58, y: 43, w: 16, h: 10, speed: 1 }
      ];
      cards.forEach((card, index) => {
        const y = card.y + Math.round(Math.sin((phase + index) * 1.7) * 2) + (card.speed * drift) % 6;
        const fill = index % 2 === 0 ? "rgba(255, 255, 255, 0.72)" : "rgba(229, 246, 255, 0.72)";
        px(target, card.x, y, card.w, card.h, "rgba(70, 90, 113, 0.20)");
        px(target, card.x + 1, y + 1, card.w - 2, card.h - 2, fill);
        px(target, card.x + 2, y + 2, card.w - 4, 2, colorMix(palette.accent, "#ffffff", 0.28));
        px(target, card.x + 3, y + 6, card.w - 8, 1, palette.accent);
        px(target, card.x + 3, y + 8, Math.max(4, card.w - 11), 1, palette.accent2);
      });
      const tap = options.motion ? Math.floor(phase * 4) % 2 : 0;
      px(target, 62, 22 + tap, 3, 3, palette.accent2);
      px(target, 65, 24 + tap, 2, 2, palette.accent2);
      px(target, 68, 27 + tap, 1, 3, palette.inkSoft);
      px(target, 61, 18, 10, 1, "rgba(70, 90, 113, 0.18)");
    }

    function drawHighDensityActionCues(target, palette, state, phase, options, features = {}) {
      if (!options.effects) return;
      const pulse = options.motion ? Math.floor(phase * 6) % 2 : 0;
      const accentSoft = colorMix(palette.accent, "#ffffff", 0.30);
      const accentDark = colorMix(palette.accent, "#000000", 0.18);

      if (state.pose === "walk") {
        const step = Math.floor(phase * 6) % 2;
        px(target, 9 + step * 3, 42.5, 5, 0.5, "rgba(82, 55, 39, 0.20)");
        px(target, 31 - step * 2, 42.5, 4.5, 0.5, "rgba(82, 55, 39, 0.16)");
        px(target, 12 + step, 39.5, 2.5, 0.5, accentSoft);
      }

      if (state.pose === "jump") {
        px(target, 10, 33 + pulse, 1, 5.5, accentSoft);
        px(target, 37, 34 - pulse, 1, 4.5, palette.accent2);
        px(target, 18, 43, 12, 0.5, "rgba(82, 55, 39, 0.13)");
      }

      if (state.pose === "stomp" || state.pose === "error") {
        px(target, 12, 42, 7, 0.5, palette.danger);
        px(target, 28, 42, 7, 0.5, palette.danger);
        px(target, 9 + pulse, 40, 2, 1, colorMix(palette.danger, "#ffffff", 0.18));
      }

      if (state.pose === "talk") {
        px(target, 14, 15 + pulse, 6, 0.5, palette.accent);
        px(target, 14, 17 + pulse, 4, 0.5, palette.accent2);
      }

      if (state.pose === "think") {
        px(target, 37, 13 - pulse, 2, 2, accentSoft);
        px(target, 41, 10 + pulse, 1.5, 1.5, palette.accent2);
        px(target, 35, 18, 1, 1, accentDark);
      }

      if (state.pose === "slump") {
        px(target, 18, 42, 13, 0.5, "rgba(89, 200, 255, 0.26)");
        px(target, 21 + pulse * 3, 41, 3, 0.5, "rgba(89, 200, 255, 0.36)");
      }

      if (state.prop === "book") {
        px(target, 18, 30 - pulse, 5, 0.5, palette.accent2);
        px(target, 26, 30 + pulse, 4, 0.5, palette.accent);
        px(target, 23.5, 32, 0.5, 5, colorMix(palette.inkSoft || palette.ink, "#ffffff", 0.14));
      }

      if (state.prop === "headphones") {
        [0, 1, 2].forEach((bar) => {
          const h = 2 + ((Math.floor(phase * 5) + bar) % 3);
          px(target, 40 + bar * 2, 18 - h, 1, h, bar % 2 ? palette.accent2 : palette.accent);
        });
      }

      if (state.prop === "browser") {
        px(target, 38, 24 + pulse, 6, 0.5, palette.accent2);
        px(target, 34, 39, 9, 0.5, colorMix(palette.accent, "#000000", 0.08));
      }

      if (state.prop === "codeRig") {
        px(target, 12, 31.5, 25, 0.5, "rgba(255, 255, 255, 0.10)");
        px(target, 30 + pulse * 3, 33, 1, 6, palette.accent2);
        px(target, 8, 45, 34, 0.5, colorMix(palette.accent, "#ffffff", 0.18));
      }

      if (state.prop === "cards") {
        px(target, 12 + pulse, 29, 8, 0.5, palette.accent2);
        px(target, 27 - pulse, 29, 7, 0.5, palette.accent);
      }

      if (state.prop === "battery") {
        px(target, 34, 29 - pulse, 2, 2, palette.accent2);
        px(target, 31, 33 + pulse, 1.5, 1.5, palette.accent);
      }

      if (features.avatarType === "human" && state.pose !== "sleep") {
        px(target, 16, 41, 16, 0.5, "rgba(82, 55, 39, 0.12)");
      }
    }

        px(target, 22, 11, 5, 1, ink);
        px(target, 17, 10, 1, 2, colorMix(palette.lensLight, "#ffffff", 0.26));
        px(target, 28, 10, 1, 2, colorMix(palette.lensLight, "#ffffff", 0.26));
        px(target, 19, 10, 1, 1, palette.lensLight);
        px(target, 30, 10, 1, 1, palette.lensLight);
      }
      target.restore();
    }

    function drawMascotFace(target, palette, eyes, mouth, isBlink, headTilt, phase = 0, options = { motion: true }) {
      const ink = palette.ink;
      const white = "#fff7dc";
      const iris = colorMix(palette.furDark, "#2f1d1a", 0.34);
      const mouthFrame = options.motion ? Math.floor(phase * 8) % 4 : 1;
      const effectiveMouth = mouth === "talk"
        ? (mouthFrame === 0 ? "talkClosed" : mouthFrame === 2 ? "talkWide" : "talkOpen")
        : mouth;
      const customBrow = eyes === "angry" || eyes === "cry";
      target.save();
      target.translate(headTilt, 0);
      if (!customBrow) {
        px(target, 15, 17, 6, 1, ink);
        px(target, 28, 17, 6, 1, ink);
      }
      if (isBlink || eyes === "sleepy") {
        px(target, 16, 20, 6, 1, ink);
        px(target, 27, 20, 6, 1, ink);
      } else if (eyes === "angry") {
        px(target, 14, 16, 3, 1, ink);
        px(target, 17, 17, 4, 1, ink);
        px(target, 20, 18, 3, 1, ink);
        px(target, 31, 16, 3, 1, ink);
        px(target, 28, 17, 4, 1, ink);
        px(target, 26, 18, 3, 1, ink);
        px(target, 15, 19, 7, 3, ink);
        px(target, 27, 19, 7, 3, ink);
        px(target, 16, 20, 5, 1, white);
        px(target, 28, 20, 5, 1, white);
        px(target, 17, 20, 2, 2, iris);
        px(target, 30, 20, 2, 2, iris);
        px(target, 13, 22, 3, 1, palette.danger);
        px(target, 33, 22, 3, 1, palette.danger);
      } else if (eyes === "cry") {
        const tearPulse = options.motion ? Math.floor(phase * 5) % 2 : 0;
        const tear = "#59c8ff";
        px(target, 15, 18, 3, 1, ink);
        px(target, 18, 19, 4, 1, ink);
        px(target, 28, 19, 4, 1, ink);
        px(target, 32, 18, 3, 1, ink);
        px(target, 16, 21, 6, 1, ink);
        px(target, 27, 21, 6, 1, ink);
        px(target, 16, 22, 5, 1, tear);
        px(target, 28, 22, 5, 1, tear);
        px(target, 17, 23 + tearPulse, 2, 4, tear);
        px(target, 30, 23 + (1 - tearPulse), 2, 4, tear);
        px(target, 18, 23 + tearPulse, 1, 1, "#ffffff");
        px(target, 31, 23 + (1 - tearPulse), 1, 1, "#ffffff");
      } else if (eyes === "happy") {
        px(target, 16, 20, 1, 1, ink);
        px(target, 17, 19, 4, 1, ink);
        px(target, 21, 20, 1, 1, ink);
        px(target, 27, 20, 1, 1, ink);
        px(target, 28, 19, 4, 1, ink);
        px(target, 32, 20, 1, 1, ink);
      } else if (eyes === "shock") {
        px(target, 15, 18, 7, 5, ink);
        px(target, 27, 18, 7, 5, ink);
        px(target, 16, 19, 5, 3, white);
        px(target, 28, 19, 5, 3, white);
        px(target, 18, 20, 2, 2, iris);
        px(target, 30, 20, 2, 2, iris);
      } else if (eyes === "confused") {
        px(target, 15, 18, 7, 4, ink);
        px(target, 28, 19, 5, 2, ink);
        px(target, 16, 19, 5, 2, white);
        px(target, 17, 19, 2, 2, iris);
        px(target, 30, 19, 2, 1, white);
      } else {
        px(target, 15, 18, 7, 4, ink);
        px(target, 27, 18, 7, 4, ink);
        px(target, 16, 19, 5, 2, white);
        px(target, 28, 19, 5, 2, white);
        px(target, 17, 19, 3, 3, iris);
        px(target, 30, 19, 3, 3, iris);
        px(target, 18, 19, 1, 1, white);
        px(target, 31, 19, 1, 1, white);
      }

      if (effectiveMouth === "talkClosed") {
        px(target, 22, 25, 7, 1, ink);
        px(target, 23, 26, 5, 1, ink);
      } else if (effectiveMouth === "talkOpen") {
        px(target, 22, 24, 7, 4, ink);
        px(target, 23, 25, 5, 2, palette.blush);
        px(target, 24, 24, 2, 1, palette.fang);
      } else if (effectiveMouth === "talkWide") {
        px(target, 21, 24, 9, 4, ink);
        px(target, 22, 25, 7, 2, palette.blush);
        px(target, 23, 24, 2, 1, palette.fang);
        px(target, 28, 24, 1, 2, palette.fang);
      } else if (effectiveMouth === "snarl") {
        px(target, 20, 24, 10, 4, ink);
        px(target, 21, 25, 8, 1, palette.fang);
        px(target, 22, 26, 6, 1, colorMix(palette.fang, palette.danger, 0.12));
        px(target, 21, 24, 2, 2, palette.fang);
        px(target, 28, 24, 1, 2, palette.fang);
        px(target, 22, 28, 7, 1, ink);
      } else if (effectiveMouth === "crying") {
        px(target, 22, 25, 1, 1, ink);
        px(target, 23, 24, 2, 1, ink);
        px(target, 25, 24, 3, 1, ink);
        px(target, 28, 25, 1, 1, ink);
        px(target, 23, 26, 5, 2, ink);
        px(target, 24, 27, 3, 1, palette.blush);
      } else if (effectiveMouth === "wave") {
        px(target, 21, 25, 2, 1, ink);
        px(target, 23, 26, 3, 1, ink);
        px(target, 26, 25, 2, 1, ink);
        px(target, 28, 24, 1, 1, ink);
      } else if (effectiveMouth === "smallOpen") {
        px(target, 23, 25, 4, 3, ink);
        px(target, 24, 26, 2, 1, palette.blush);
      } else if (effectiveMouth === "flat" || effectiveMouth === "tiny") {
        px(target, 22, 26, 6, 1, ink);
      } else if (effectiveMouth === "sleep") {
        px(target, 23, 25, 1, 1, ink);
        px(target, 24, 26, 2, 1, ink);
        px(target, 26, 25, 1, 1, ink);
      } else {
        px(target, 21, 25, 2, 1, ink);
        px(target, 23, 26, 4, 1, ink);
        px(target, 27, 25, 3, 1, ink);
        px(target, 29, 24, 1, 1, ink);
        px(target, 28, 26, 1, 2, palette.fang);
      }
      target.restore();
    }

    function drawMascotSitting(target, palette, phase, options, headTilt, state, features = getActiveFeatures()) {
      const ink = palette.ink;
      const pawLift = options.motion ? Math.floor(phase * 4) % 2 : 0;
      px(target, 34, 33, 5, 4, ink);
      px(target, 38, 31, 5, 5, ink);
      px(target, 40, 34, 4, 5, ink);
      px(target, 35, 34, 4, 2, palette.mane);
      px(target, 38, 32, 4, 4, palette.furDark);
      px(target, 41, 35, 2, 3, palette.belly);

      px(target, 12, 28, 24, 12, ink);
      px(target, 13, 29, 22, 10, palette.fur);
      px(target, 18, 29, 12, 11, palette.belly);
      px(target, 20, 30, 8, 9, colorMix(palette.belly, "#ffffff", 0.18));
      px(target, 14, 31, 3, 2, palette.spot);
      px(target, 31, 34, 2, 2, palette.spot);

      px(target, 14, 37, 9, 4, ink);
      px(target, 26, 37, 9, 4, ink);
      px(target, 15, 37, 7, 3, palette.fur);
      px(target, 27, 37, 7, 3, palette.fur);
      px(target, 13, 40, 10, 2, palette.shoe);
      px(target, 26, 40, 10, 2, palette.shoe);
      px(target, 16, 38, 2, 1, colorMix(palette.fur, "#ffffff", 0.20));
      px(target, 30, 38, 2, 1, colorMix(palette.fur, "#ffffff", 0.20));

      px(target, 11, 31 + pawLift, 8, 3, ink);
      px(target, 12, 31 + pawLift, 6, 2, palette.fur);
      px(target, 30, 31 - pawLift, 8, 3, ink);
      px(target, 31, 31 - pawLift, 6, 2, palette.fur);

      target.save();
      target.translate(0, 9);
      drawMascotEarsAndMane(target, palette, headTilt, phase, options, features);
      drawMascotHead(target, palette, headTilt);
      drawMascotSunglasses(target, palette, headTilt, features);
      drawMascotFace(target, palette, state.eyes, state.mouth, false, headTilt, phase, options);
      target.restore();
    }

    function drawMascotSleeping(target, palette, phase, options, features = getActiveFeatures()) {
      const breathe = options.motion ? Math.round(Math.sin(phase * 2) > 0 ? 1 : 0) : 0;
      const ink = palette.ink;

      px(target, 25, 31 - breathe, 15, 10 + breathe, ink);
      px(target, 26, 32 - breathe, 13, 8 + breathe, palette.fur);
      px(target, 29, 33 - breathe, 8, 6 + breathe, palette.belly);
      px(target, 38, 32, 5, 4, ink);
      px(target, 39, 33, 4, 3, palette.furDark);
      px(target, 40, 36, 3, 3, palette.belly);
      px(target, 32, 39, 9, 2, palette.shoe);
      px(target, 27, 34, 2, 2, palette.spot);
      px(target, 35, 35, 2, 2, palette.spot);

      px(target, 12, 37, 12, 3, ink);
      px(target, 13, 37, 10, 2, palette.fur);
      px(target, 22, 38, 7, 2, ink);
      px(target, 23, 38, 5, 1, palette.fur);

      target.save();
      target.translate(0, 12);
      drawMascotEarsAndMane(target, palette, 0, phase, { ...options, motion: false }, features);
      drawMascotHead(target, palette, 0);
      drawMascotSunglasses(target, palette, 0, features);
      drawMascotFace(target, palette, "sleepy", "sleep", false, 0);
      target.restore();

      px(target, 12, 42, 28, 1, "rgba(82, 55, 39, 0.14)");
    }

    function drawMascotProp(target, palette, prop, phase, options) {
      if (!prop) return;
      const alt = options.motion ? Math.floor(phase * 6) % 2 : 0;
      const ink = palette.ink;
      const panel = colorMix(palette.belly, "#ffffff", 0.18);

      if (prop === "bubble") {
        px(target, 5, 10, 10, 6, ink);
        px(target, 6, 11, 8, 4, "#ffffff");
        px(target, 9, 16, 2, 2, ink);
        px(target, 7, 12, 2, 2, palette.accent);
        px(target, 11, 12, 2, 2, palette.accent2);
        return;
      }

      if (prop === "keyboard") {
        px(target, 14, 37, 20, 3, ink);
        px(target, 16, 36, 16, 2, palette.inkSoft);
        px(target, 18, 37, 2, 1, palette.accent);
        px(target, 22 + alt * 4, 37, 2, 1, palette.accent2);
        px(target, 30, 37, 2, 1, colorMix(palette.accent, "#ffffff", 0.24));
        return;
      }

      if (prop === "book") {
        px(target, 16, 31, 8, 7, ink);
        px(target, 24, 31, 8, 7, ink);
        px(target, 17, 32, 7, 5, palette.belly);
        px(target, 25, 32, 6, 5, panel);
        px(target, 24, 31, 1, 7, palette.inkSoft);
        px(target, 19, 34, 3, 1, palette.accent2);
        px(target, 27, 34, 3, 1, palette.accent);
        return;
      }

      if (prop === "headphones") {
        px(target, 13, 16, 2, 7, ink);
        px(target, 34, 16, 2, 7, ink);
        px(target, 14, 14, 2, 2, palette.accent);
        px(target, 32, 14, 2, 2, palette.accent);
        px(target, 16, 12, 16, 1, ink);
        px(target, 18, 11, 12, 1, palette.accent2);
        return;
      }

      if (prop === "browser") {
        const scroll = options.motion ? Math.floor(phase * 5) % 4 : 1;
        px(target, 31, 21, 15, 18, ink);
        px(target, 32, 22, 13, 16, "#eef8ff");
        px(target, 33, 23, 11, 3, colorMix(palette.accent, "#ffffff", 0.35));
        px(target, 34, 28 - scroll, 8, 1, palette.accent);
        px(target, 34, 31 - scroll, 6, 1, palette.accent2);
        px(target, 34, 34 - scroll, 9, 1, colorMix(palette.accent, "#000000", 0.06));
        px(target, 34, 37 - scroll, 5, 1, palette.accent);
        px(target, 36 + alt, 40, 4, 1, palette.accent2);
        return;
      }

      if (prop === "codeRig") {
        const cursor = options.motion ? Math.floor(phase * 6) % 2 : 1;
        px(target, 8, 30, 32, 12, ink);
        px(target, 10, 31, 28, 9, "#1d293d");
        drawPixelString(target, 12, 33, "101", palette.accent, 1, 1);
        drawPixelString(target, 23, 33, "0", palette.accent2, 1, 1);
        drawPixelString(target, 12, 37, "0 10", colorMix(palette.accent, "#ffffff", 0.24), 1, 1);
        if (cursor) px(target, 34, 37, 2, 4, palette.accent2);
        px(target, 6, 42, 36, 3, ink);
        px(target, 13, 41, 22, 1, palette.inkSoft);
        px(target, 18 + alt * 6, 43, 4, 1, colorMix(palette.accent2, "#ffffff", 0.2));
        return;
      }

      if (prop === "screen" || prop === "laptop") {
        px(target, 12, 30, 24, 11, ink);
        px(target, 14, 31, 20, 8, prop === "laptop" ? "#253148" : "#20424b");
        px(target, 16, 33, 6, 1, palette.accent);
        px(target, 24, 35, 7, 1, palette.accent2);
        px(target, 18 + alt * 5, 37, 3, 1, colorMix(palette.accent, "#ffffff", 0.32));
        px(target, 10, 41, 28, 2, ink);
        px(target, 15, 40, 18, 1, palette.inkSoft);
        return;
      }

      if (prop === "magnifier") {
        px(target, 34, 28, 7, 7, ink);
        px(target, 35, 29, 5, 5, "#ffffff");
        px(target, 36, 30, 3, 3, colorMix(palette.accent, "#ffffff", 0.46));
        px(target, 40, 34, 2, 2, ink);
        px(target, 42, 36, 2, 2, palette.shoe);
        return;
      }

      if (prop === "cards") {
        px(target, 12, 31, 9, 8, ink);
        px(target, 22, 30, 9, 8, ink);
        px(target, 17, 35, 9, 8, ink);
        px(target, 13, 32, 7, 6, "#ffffff");
        px(target, 23, 31, 7, 6, panel);
        px(target, 18, 36, 7, 6, colorMix(palette.accent, "#ffffff", 0.62));
        px(target, 15, 34, 3, 1, palette.accent2);
        px(target, 25, 33, 3, 1, palette.accent);
        return;
      }

      if (prop === "battery") {
        const fill = 1 + (options.motion ? Math.floor(phase * 2) % 4 : 3);
        px(target, 36, 31, 8, 12, ink);
        px(target, 38, 29, 4, 2, ink);
        px(target, 37, 32, 6, 10, "#ffffff");
        px(target, 38, 41 - fill * 2, 4, fill * 2, palette.accent);
        px(target, 31, 39, 5, 1, palette.accent2);
        px(target, 29, 38, 2, 2, palette.accent2);
      }
    }

    function drawSpriteEffects(target, palette, fx, phase, options) {
      target.save();
      target.translate(SPRITE_OFFSET_X, SPRITE_OFFSET_Y);

    }

    function drawHumanSitting(target, palette, phase, options, headTilt, state, features) {
      const ink = palette.ink || "#17171b";

      drawBackHair(target, palette, headTilt, phase, options, features);
      target.restore();
      px(target, 16, 31, 17, 9, ink);
      px(target, 17, 31, 15, 8, palette.shirt);
      px(target, 18, 34, 13, 3, palette.shirtDark);
      px(target, 13, 38, 11, 4, ink);
      px(target, 25, 38, 11, 4, ink);
      px(target, 14, 38, 9, 3, palette.skin);
      px(target, 26, 38, 9, 3, palette.skin);
      px(target, 13, 41, 10, 2, palette.shoe);
      px(target, 26, 41, 10, 2, palette.shoe);
      px(target, 12, 32 + (sway > 0 ? 1 : 0), 7, 3, ink);
      px(target, 13, 32 + (sway > 0 ? 1 : 0), 6, 2, palette.skin);
      px(target, 30, 32 - (sway > 0 ? 1 : 0), 7, 3, ink);
