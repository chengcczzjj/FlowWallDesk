<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 外层 Dock 悬浮阴影 -->
        <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.2" />
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.1" />
        </filter>
        
        <!-- Mac 显示器物理投影 -->
        <filter id="monitorShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
        </filter>

        <!-- 纯净苹果白到浅银色底板渐变 (维持整个图标库统一的高级感) -->
        <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E5E5EA" />
        </linearGradient>

        <!-- 显示器黑色玻璃边框渐变 -->
        <linearGradient id="bezelGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2C2C2E" />
            <stop offset="100%" stop-color="#111112" />
        </linearGradient>

        <!-- 银色金属支架渐变 -->
        <linearGradient id="metalStand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F4F5F7" />
            <stop offset="100%" stop-color="#A1A6B0" />
        </linearGradient>

        <!-- ★ 桌面壁纸：晴空蓝渐变 -->
        <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E0F2FE" />
            <stop offset="100%" stop-color="#7DD3FC" />
        </linearGradient>

        <!-- ★ 桌面壁纸：抽象山峦渐变 -->
        <linearGradient id="landscapeGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#3B82F6" />
        </linearGradient>

        <!-- 顶部 3D 玻璃反光 -->
        <linearGradient id="highlightGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
            <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
        </linearGradient>

        <clipPath id="squircle">
            <rect x="48" y="48" width="416" height="416" rx="94" />
        </clipPath>

        <!-- ★ 完美的屏幕内裁切区 (24外圆角 - 14厚度 = 10内圆角) -->
        <clipPath id="innerScreenClip">
            <rect x="110" y="128" width="292" height="188" rx="10" />
        </clipPath>

        <!-- 可复用的 macOS 经典蓝文件夹组件 -->
        <g id="mac-folder">
            <path d="M 0 2 C 0 1, 1 0, 2 0 L 8 0 C 9 0, 9.5 0.5, 10 1 L 12 3 L 18 3 C 19 3, 20 4, 20 5 L 20 12 C 20 13, 19 14, 18 14 L 2 14 C 1 14, 0 13, 0 12 Z" fill="#78C6FF"/>
            <rect x="0" y="3" width="20" height="11" rx="1.5" fill="#007AFF"/>
        </g>
    </defs>

    <!-- 底座整体阴影 -->
    <rect x="48" y="48" width="416" height="416" rx="94" fill="#000000" filter="url(#appShadow)" />

    <!-- 图标主容器 -->
    <g clip-path="url(#squircle)">
        
        <!-- 银白质感底板 -->
        <rect x="48" y="48" width="416" height="416" fill="url(#bgGradient)" />

        <!-- 核心图形：Mac 显示器 -->
        <g filter="url(#monitorShadow)">
            <!-- 支架底座 -->
            <rect x="176" y="368" width="160" height="12" rx="6" fill="url(#metalStand)" />
            <!-- 支架颈部 -->
            <rect x="232" y="330" width="48" height="44" fill="url(#metalStand)" />
            <!-- 显示器外框 -->
            <rect x="96" y="114" width="320" height="216" rx="24" fill="url(#bezelGradient)" />
        </g>

        <!-- 屏幕内部内容 -->
        <g clip-path="url(#innerScreenClip)">
            
            <!-- 1. 清爽的晴空壁纸背景 -->
            <rect x="110" y="128" width="292" height="188" fill="url(#skyGradient)" />
            
            <!-- 2. Big Sur 风格山峦抽象曲线 -->
            <path d="M 110 240 Q 256 160 402 260 L 402 316 L 110 316 Z" fill="url(#landscapeGradient)" fill-opacity="0.8" />
            <path d="M 110 270 Q 200 230 300 270 T 402 240 L 402 316 L 110 316 Z" fill="#2563EB" fill-opacity="0.3" />

            <!-- 3. 顶部菜单栏 -->
            <rect x="110" y="128" width="292" height="14" fill="#000000" fill-opacity="0.1" />
            <rect x="360" y="133" width="34" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.9" />

            <!-- 4. 彻底展现的桌面标志物：右侧文件夹 -->
            <use href="#mac-folder" x="372" y="152" />
            <use href="#mac-folder" x="372" y="174" />
            <use href="#mac-folder" x="372" y="196" />

            <!-- 5. 动画逻辑：被强烈推开（飞出屏幕）的窗口与速度线 -->
            
            <!-- 向左下飞出的窗口 -->
            <g transform="translate(60, 150) rotate(-12)">
                <rect x="0" y="0" width="100" height="70" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#000000" stroke-opacity="0.1" stroke-width="1.5"/>
                <rect x="0" y="0" width="100" height="16" fill="#000000" fill-opacity="0.05" />
                <circle cx="10" cy="8" r="3" fill="#FF3B30" />
                <circle cx="18" cy="8" r="3" fill="#FF9500" />
                <circle cx="26" cy="8" r="3" fill="#4CD964" />
            </g>
            <!-- 左侧速度残影线 (指向中心，表示它刚从中心离开) -->
            <path d="M 140 180 L 175 190 M 130 205 L 160 215" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />

            <!-- 向右方飞出的窗口 -->
            <g transform="translate(340, 160) rotate(15)">
                <rect x="0" y="0" width="110" height="80" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#000000" stroke-opacity="0.1" stroke-width="1.5"/>
                <rect x="0" y="0" width="110" height="16" fill="#000000" fill-opacity="0.05" />
                <circle cx="10" cy="8" r="3" fill="#FF3B30" />
                <circle cx="18" cy="8" r="3" fill="#FF9500" />
            </g>
            <!-- 右侧速度残影线 -->
            <path d="M 345 220 L 310 210 M 350 240 L 325 230" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />

            <!-- 向上方飞出的窗口 -->
            <g transform="translate(190, 80) rotate(5)">
                <rect x="0" y="0" width="120" height="60" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#000000" stroke-opacity="0.1" stroke-width="1.5"/>
                <rect x="0" y="0" width="120" height="16" fill="#000000" fill-opacity="0.05" />
                <circle cx="10" cy="8" r="3" fill="#FF3B30" />
            </g>
            <!-- 上方速度残影线 -->
            <path d="M 230 145 L 225 170 M 270 148 L 265 165" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />

            <!-- 6. 底部居中的 Dock 栏 (锚定桌面环境) -->
            <rect x="206" y="296" width="100" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1" />
            <!-- Dock 上的精致 App 小圆点 -->
            <circle cx="220" cy="303" r="3.5" fill="#FF3B30" />
            <circle cx="232" cy="303" r="3.5" fill="#FF9500" />
            <circle cx="244" cy="303" r="3.5" fill="#4CD964" />
            <circle cx="256" cy="303" r="3.5" fill="#0A84FF" />
            <circle cx="268" cy="303" r="3.5" fill="#5E5CE6" />
            <circle cx="280" cy="303" r="3.5" fill="#FFFFFF" />
            <circle cx="292" cy="303" r="3.5" fill="#FF2D55" />
        </g>

        <!-- 3D 玻璃材质高光 -->
        <rect x="48" y="48" width="416" height="416" rx="94" fill="none" stroke="url(#highlightGradient)" stroke-width="5" />
        <!-- 边缘内发光阴影，增强厚度 -->
        <rect x="48" y="48" width="416" height="416" rx="94" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.08" />
    </g>
</svg>
