<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 外层 Dock 悬浮阴影 -->
        <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.2" />
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.1" />
        </filter>
        
        <!-- 整个文件夹脱离底板的物理投影 -->
        <filter id="folderShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#B45309" flood-opacity="0.3" />
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
        </filter>

        <!-- 蓝色内页投射在后盖上的立体阴影 -->
        <filter id="insertShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
        </filter>

        <!-- 文件夹前盖产生的环境光遮蔽（AO），向内侧投射暗影 -->
        <filter id="frontFlapShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
        </filter>

        <!-- 纯净苹果白到浅银色底板渐变 (维持整个图标库统一) -->
        <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E5E5EA" />
        </linearGradient>

        <!-- 文件夹后盖：深沉的琥珀黄/深橙色 -->
        <linearGradient id="backFlapGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#9A3412" />
        </linearGradient>

        <!-- 文件夹内页：标志性的 Windows 亮蓝/青色玻璃渐变 -->
        <linearGradient id="insertGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#0284C7" />
        </linearGradient>

        <!-- 文件夹前盖：明亮、光泽的纯正亮黄色 -->
        <linearGradient id="frontFlapGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="100%" stop-color="#F59E0B" />
        </linearGradient>

        <!-- 前盖顶部的高光描边，模拟材质的厚度与倒角反光 -->
        <linearGradient id="flapHighlight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
        </linearGradient>

        <!-- 顶部 3D 玻璃反光 -->
        <linearGradient id="highlightGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
            <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
        </linearGradient>

        <clipPath id="squircle">
            <rect x="48" y="48" width="416" height="416" rx="94" />
        </clipPath>
    </defs>

    <!-- 底座整体外阴影 -->
    <rect x="48" y="48" width="416" height="416" rx="94" fill="#000000" filter="url(#appShadow)" />

    <!-- 图标主容器 -->
    <g clip-path="url(#squircle)">
        
        <!-- 银白质感底板 -->
        <rect x="48" y="48" width="416" height="416" fill="url(#bgGradient)" />

        <!-- 核心图形组：带有投影的资源管理器文件夹 -->
        <g filter="url(#folderShadow)">
            
            <!-- ============================== -->
            <!-- 1. 文件夹后盖 (带有经典左侧标签) -->
            <!-- ============================== -->
            <path d="M 106 360 
                     L 106 170 C 106 150, 120 136, 140 136 
                     L 210 136 C 220 136, 228 142, 234 152 
                     L 248 174 
                     L 372 174 C 392 174, 406 188, 406 208 
                     L 406 360 C 406 380, 392 394, 372 394 
                     L 140 394 C 120 394, 106 380, 106 360 Z" 
                  fill="url(#backFlapGradient)" />

            <!-- ============================== -->
            <!-- 2. 内嵌的亮蓝色 UI 文件板 -->
            <!-- ============================== -->
            <g filter="url(#insertShadow)">
                <rect x="146" y="148" width="220" height="230" rx="16" fill="url(#insertGradient)" />
                
                <!-- 蓝板上的白色微缩 UI 骨架 (隐喻文件列表，增强资源管理器概念) -->
                <!-- 顶部文件项目 1 -->
                <rect x="166" y="170" width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.95" />
                <rect x="214" y="176" width="110" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
                <rect x="214" y="192" width="70" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5" />
                
                <!-- 中部文件项目 2 -->
                <rect x="166" y="218" width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.95" />
                <rect x="214" y="224" width="90" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
                <rect x="214" y="240" width="50" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5" />
            </g>

            <!-- ============================== -->
            <!-- 3. 文件夹前盖 (明黄高亮) -->
            <!-- ============================== -->
            <g filter="url(#frontFlapShadow)">
                <path d="M 106 360 
                         L 106 250 C 106 230, 120 216, 140 216 
                         L 372 216 C 392 216, 406 230, 406 250 
                         L 406 360 C 406 380, 392 394, 372 394 
                         L 140 394 C 120 394, 106 380, 106 360 Z" 
                      fill="url(#frontFlapGradient)" />
                
                <!-- 前盖顶部的亮色玻璃厚度高光描边 -->
                <path d="M 106 250 C 106 230, 120 216, 140 216 
                         L 372 216 C 392 216, 406 230, 406 250" 
                      fill="none" stroke="url(#flapHighlight)" stroke-width="3" stroke-linecap="round" />
            </g>
        </g>

        <!-- 全局 3D 玻璃材质高光 -->
        <rect x="48" y="48" width="416" height="416" rx="94" fill="none" stroke="url(#highlightGradient)" stroke-width="5" />
        <!-- 边缘内发光阴影，增强厚度 -->
        <rect x="48" y="48" width="416" height="416" rx="94" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.08" />
    </g>
</svg>
