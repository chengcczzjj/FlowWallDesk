<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.25" />
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.15" />
        </filter>
        
        <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
        </filter>

        <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F9FAFB" />
            <stop offset="100%" stop-color="#D1D5DB" />
        </linearGradient>
        
        <linearGradient id="gearGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#737982" />
            <stop offset="100%" stop-color="#40444A" />
        </linearGradient>

        <linearGradient id="highlightGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
            <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
        </linearGradient>

        <clipPath id="squircle">
            <rect x="48" y="48" width="416" height="416" rx="94" />
        </clipPath>

        <mask id="gearHole">
            <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
            <circle cx="256" cy="256" r="76" fill="#000000" />
        </mask>
    </defs>

    <rect x="48" y="48" width="416" height="416" rx="94" fill="#000000" filter="url(#appShadow)" />

    <g clip-path="url(#squircle)">
        <rect x="48" y="48" width="416" height="416" fill="url(#bgGradient)" />

        <g filter="url(#gearShadow)">
            <g mask="url(#gearHole)" fill="url(#gearGradient)">
                
                <rect x="240" y="102" width="32" height="308" rx="8" />
                <rect x="240" y="102" width="32" height="308" rx="8" transform="rotate(22.5 256 256)" />
                <rect x="240" y="102" width="32" height="308" rx="8" transform="rotate(45 256 256)" />
                <rect x="240" y="102" width="32" height="308" rx="8" transform="rotate(67.5 256 256)" />
                <rect x="240" y="102" width="32" height="308" rx="8" transform="rotate(90 256 256)" />
                <rect x="240" y="102" width="32" height="308" rx="8" transform="rotate(112.5 256 256)" />
                <rect x="240" y="102" width="32" height="308" rx="8" transform="rotate(135 256 256)" />
                <rect x="240" y="102" width="32" height="308" rx="8" transform="rotate(157.5 256 256)" />
                
                <circle cx="256" cy="256" r="140" />
            </g>
        </g>

        <circle cx="256" cy="256" r="76" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.4" filter="url(#gearShadow)"/>
        <circle cx="256" cy="256" r="76" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.2" />

        <rect x="48" y="48" width="416" height="416" rx="94" fill="none" stroke="url(#highlightGradient)" stroke-width="6" />
        <rect x="48" y="48" width="416" height="416" rx="94" fill="none" stroke="#000000" stroke-width="2" stroke-opacity="0.12" />
    </g>
</svg>
